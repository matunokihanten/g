<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スピニングダンサー錯視 ラボ (Spinning Dancer Perception Lab)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: #0b0c0f;
      color: #f0f3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: env(safe-area-inset-top, 6px) 10px env(safe-area-inset-bottom, 6px) 10px;
      user-select: none;
    }

    /* ヘッダーエリア */
    header {
      width: 100%;
      max-width: 640px;
      text-align: center;
      flex-shrink: 0;
      padding-top: 2px;
    }
    h1 {
      margin: 0 0 2px;
      font-size: clamp(0.92rem, 3.6vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .status-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: clamp(0.68rem, 2.3vw, 0.78rem);
      color: #9ba3af;
      margin-top: 2px;
    }
    .badge {
      background: #181b22;
      border: 1px solid #2d3340;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge strong {
      color: #58a6ff;
    }

    /* メインステージ */
    .stage {
      display: flex;
      gap: clamp(6px, 1.8vw, 16px);
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1;
      min-height: 0;
      padding: 4px 0;
    }

    .dancer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 0;
      flex: 1 1 0;
      max-width: 200px;
    }
    .dancer-container.main {
      flex: 1.35 1 0;
      max-width: 270px;
    }
    .stage.guides-hidden .dancer-container.main {
      max-width: 340px;
      flex: 1 1 100%;
    }

    .canvas-wrapper {
      width: 100%;
      height: calc(100% - 22px);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      border-radius: 10px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1c2027 0%, #0e1014 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .canvas-wrapper.center-bg {
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #cbd2db 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .canvas-wrapper canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    .label {
      height: 18px;
      line-height: 18px;
      margin-top: 3px;
      font-size: clamp(0.64rem, 2.1vw, 0.74rem);
      color: #9aa0a6;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .dancer-container.main .label {
      color: #ffffff;
      font-weight: 600;
    }

    /* コントロール・ドック（操作パネル） */
    .dock-panel {
      width: 100%;
      max-width: 580px;
      background: #14171f;
      border: 1px solid #292f3d;
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    /* スライダー群 */
    .slider-row {
      display: grid;
      grid-template-columns: 82px 1fr 40px;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: #c0c6d0;
    }
    input[type=range] {
      accent-color: #58a6ff;
      height: 4px;
      width: 100%;
      cursor: pointer;
    }
    .slider-val {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #8c95a5;
    }

    /* アクションボタン群 */
    .button-row {
      display: flex;
      gap: 6px;
      justify-content: space-between;
      margin-top: 2px;
    }
    .btn {
      flex: 1;
      background: #202430;
      color: #e6edf3;
      border: 1px solid #3d4556;
      padding: 7px 4px;
      font-size: clamp(0.68rem, 2.3vw, 0.78rem);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, transform 0.05s;
    }
    .btn:active {
      transform: scale(0.97);
      background: #2c3345;
    }
    .btn.active-cw {
      border-color: #1e88e5;
      background: rgba(30, 136, 229, 0.2);
    }
    .btn.active-ccw {
      border-color: #e53935;
      background: rgba(229, 57, 53, 0.2);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header>
    <h1>スピニングダンサー錯視 ラボ</h1>
    <div class="status-bar">
      <span class="badge">視覚切替: <strong id="switchCount">0</strong>回</span>
      <span class="badge">現在認識: <strong id="currentPerception">未選択</strong></span>
      <span class="badge">維持時間: <strong id="holdTime">0.0s</strong></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="dancer-container side-guide">
      <div class="canvas-wrapper" id="wrapLeft"></div>
      <div class="label" style="color: #4da3ff;">時計回り（右足手前）</div>
    </div>

    <div class="dancer-container main">
      <div class="canvas-wrapper center-bg" id="wrapCenter"></div>
      <div class="label"><strong>錯視シルエット</strong></div>
    </div>

    <div class="dancer-container side-guide">
      <div class="canvas-wrapper" id="wrapRight"></div>
      <div class="label" style="color: #ff5252;">反時計回り（左足手前）</div>
    </div>
  </div>

  <div class="dock-panel">
    <!-- スライダー1: 視点仰角（煽り・俯瞰） -->
    <div class="slider-row">
      <span>視点仰角(チルト)</span>
      <input type="range" id="pitchSlider" min="-30" max="30" value="0" step="1">
      <span class="slider-val" id="pitchVal">0°</span>
    </div>

    <!-- スライダー2: 奥行き透かし強度 -->
    <div class="slider-row">
      <span>奥行アシスト</span>
      <input type="range" id="assistSlider" min="0" max="100" value="0" step="1">
      <span class="slider-val" id="assistVal">0%</span>
    </div>

    <!-- ボタン行: 知覚反転タスク ＆ ガイド表示 -->
    <div class="button-row">
      <button class="btn" id="btnPerceiveCw">↻ 時計回りに見えた</button>
      <button class="btn" id="btnPerceiveCcw">↺ 反時計に見えた</button>
      <button class="btn" id="toggleGuidesBtn" style="flex: 0.85;">ガイド非表示</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 人体オーガニック曲面モデリング（高精度プロポーション）
    // -------------------------------------------------------------
    function createRealisticDancer(mode) {
      const group = new THREE.Group();

      let matCenter = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide });
      
      // 中央の奥行きアシスト用ブレンドマテリアル
      let matCenterAssist = new THREE.MeshPhongMaterial({
        color: 0x3a404d,
        emissive: 0x111317,
        specular: 0x90a4ae,
        shininess: 30,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.0
      });

      let matTorso, matLeft, matRight, matWhite;
      if (mode !== 'center') {
        matTorso = new THREE.MeshPhongMaterial({
          color: 0x23272f,
          emissive: 0x101217,
          specular: 0x777e8a,
          shininess: 45,
          side: THREE.DoubleSide
        });
        matLeft = new THREE.MeshPhongMaterial({
          color: 0x1e88e5,
          emissive: 0x0d47a1,
          specular: 0x90caf9,
          shininess: 55,
          side: THREE.DoubleSide
        });
        matRight = new THREE.MeshPhongMaterial({
          color: 0xe53935,
          emissive: 0xb71c1c,
          specular: 0xffcdd2,
          shininess: 55,
          side: THREE.DoubleSide
        });
        matWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      }

      function getMat(type) {
        if (mode === 'center') return matCenter;
        if (type === 'left') return matLeft;
        if (type === 'right') return matRight;
        if (type === 'white') return matWhite;
        return matTorso;
      }

      function createLatheBody(points, segs = 32, matType = 'torso') {
        const pts = points.map(p => new THREE.Vector2(p[0], p[1]));
        const geom = new THREE.LatheGeometry(pts, segs);
        const mesh = new THREE.Mesh(geom, getMat(matType));
        return mesh;
      }

      // 1. 頭部・ポニーテール
      const headGeom = new THREE.SphereGeometry(3.6, 24, 24);
      headGeom.scale(0.95, 1.25, 1.05);
      const head = new THREE.Mesh(headGeom, getMat('torso'));
      head.position.set(0, 31.8, 0);
      group.add(head);

      const ponytailCurve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0, 33.2, -3.2),
        new THREE.Vector3(0, 32.5, -6.8),
        new THREE.Vector3(0, 27.5, -8.5)
      );
      const ponytail = new THREE.Mesh(new THREE.TubeGeometry(ponytailCurve, 16, 1.1, 12, false), getMat('torso'));
      group.add(ponytail);

      const neckPts = [[0.0, 30.0], [1.3, 29.5], [1.2, 27.5], [1.6, 25.5], [0.0, 25.2]];
      group.add(createLatheBody(neckPts, 24, 'torso'));

      // 2. トルソー
      const torsoPts = [
        [0.0, 25.4], [3.6, 24.5], [4.2, 22.8], [3.7, 21.0], [2.7, 18.2], [3.6, 15.5], [4.3, 13.0], [3.8, 10.5], [0.0, 10.0]
      ];
      const torso = createLatheBody(torsoPts, 32, 'torso');
      torso.scale.set(1.0, 1.0, 0.88);
      group.add(torso);

      if (mode !== 'center') {
        const spineGeom = new THREE.CylinderGeometry(0.3, 0.3, 14.5, 8);
        const spineLine = new THREE.Mesh(spineGeom, matWhite);
        spineLine.position.set(0, 18.5, 3.4);
        group.add(spineLine);
      }

      // 3. 軸足（左脚）
      const lThighPts = [[0.0, 10.5], [2.4, 9.5], [2.2, 6.0], [1.8, 2.5], [1.5, 0.0], [0.0, -0.5]];
      const lThigh = createLatheBody(lThighPts, 24, 'left');
      lThigh.position.set(-1.7, 0, 0);
      group.add(lThigh);

      const lKnee = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), getMat('left'));
      lKnee.position.set(-1.7, 0, 0.2);
      group.add(lKnee);

      const lCalfPts = [[0.0, 0.2], [1.6, -1.5], [1.8, -4.0], [1.2, -9.0], [0.8, -12.5], [0.75, -14.5], [0.4, -17.5], [0.0, -18.0]];
      const lCalf = createLatheBody(lCalfPts, 24, 'left');
      lCalf.position.set(-1.7, 0, 0);
      group.add(lCalf);

      // 4. 上げ足（右脚）
      const rLegGroup = new THREE.Group();
      const rThighPts = [[0.0, 0], [2.4, -1.0], [2.2, -4.5], [1.8, -8.0], [1.5, -11.0], [0.0, -11.5]];
      rLegGroup.add(createLatheBody(rThighPts, 24, 'right'));

      const rKneeMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), getMat('right'));
      rKneeMesh.position.set(0, -11.5, 0.2);
      rLegGroup.add(rKneeMesh);

      const rLowerLegGroup = new THREE.Group();
      rLowerLegGroup.position.set(0, -11.5, 0);
      const rCalfPts = [[0.0, 0], [1.6, -1.5], [1.7, -4.0], [1.1, -9.0], [0.75, -12.5], [0.7, -15.0], [0.35, -18.0], [0.0, -18.5]];
      rLowerLegGroup.add(createLatheBody(rCalfPts, 24, 'right'));
      rLowerLegGroup.rotation.z = -0.22;
      rLegGroup.add(rLowerLegGroup);

      rLegGroup.position.set(2.0, 10.5, 0.5);
      rLegGroup.rotation.z = -Math.PI / 2.35;
      rLegGroup.rotation.y = 0.28;
      group.add(rLegGroup);

      // 5. 腕部
      const lArmCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-3.8, 24.0, 0.0),
        new THREE.Vector3(-8.5, 20.0, -1.5),
        new THREE.Vector3(-13.0, 15.0, -3.0),
        new THREE.Vector3(-15.5, 11.5, -4.0)
      ]);
      group.add(new THREE.Mesh(new THREE.TubeGeometry(lArmCurve, 20, 1.1, 14, false), getMat('left')));

      const rArmCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(3.8, 24.0, 0.0),
        new THREE.Vector3(8.5, 22.0, 3.5),
        new THREE.Vector3(13.0, 18.5, 7.0),
        new THREE.Vector3(15.5, 15.0, 9.5)
      ]);
      group.add(new THREE.Mesh(new THREE.TubeGeometry(rArmCurve, 20, 1.1, 14, false), getMat('right')));

      // つま先軌道リング（視線チルト時の楕円手がかり）
      const orbitGeom = new THREE.RingGeometry(22.8, 23.3, 48);
      const orbitMat = new THREE.MeshBasicMaterial({
        color: mode === 'center' ? 0x000000 : (mode === 'cw' ? 0x4da3ff : 0xff5252),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: mode === 'center' ? 0.15 : 0.4
      });
      const orbitRing = new THREE.Mesh(orbitGeom, orbitMat);
      orbitRing.rotation.x = Math.PI / 2;
      orbitRing.position.set(2.0, 7.0, 0.5);
      group.add(orbitRing);

      return { group, matCenterAssist, matCenter };
    }

    // -------------------------------------------------------------
    // ビューポート初期化
    // -------------------------------------------------------------
    const frustumSize = 64;

    function createViewer(containerId, mode) {
      const container = document.getElementById(containerId);
      const scene = new THREE.Scene();

      const aspect = container.clientWidth / container.clientHeight || 0.65;
      const camera = new THREE.OrthographicCamera(
        (frustumSize * aspect) / -2,
        (frustumSize * aspect) / 2,
        frustumSize / 2,
        frustumSize / -2,
        1,
        1000
      );
      camera.position.set(0, 7, 100);
      camera.lookAt(0, 7, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // ライト設定
      const light = new THREE.DirectionalLight(0xffffff, 1.45);
      light.position.set(20, 30, 80);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404552, 0.75));

      const { group, matCenterAssist, matCenter } = createRealisticDancer(mode);
      scene.add(group);

      return { container, scene, camera, renderer, dancer: group, matCenterAssist, matCenter, mode };
    }

    const vLeft   = createViewer('wrapLeft', 'cw');
    const vCenter = createViewer('wrapCenter', 'center');
    const vRight  = createViewer('wrapRight', 'ccw');

    // 右側モデルの幾何学的前後反転（2D輪郭は完全同一のまま手前奥を逆転）
    vRight.dancer.scale.z = -1;

    const viewers = [vLeft, vCenter, vRight];

    function onResize() {
      viewers.forEach(v => {
        const w = v.container.clientWidth;
        const h = v.container.clientHeight;
        if (w === 0 || h === 0) return;

        const aspect = w / h;
        v.camera.left = (-frustumSize * aspect) / 2;
        v.camera.right = (frustumSize * aspect) / 2;
        v.camera.top = frustumSize / 2;
        v.camera.bottom = -frustumSize / 2;
        v.camera.updateProjectionMatrix();

        v.renderer.setSize(w, h);
      });
    }
    window.addEventListener('resize', onResize);

    // -------------------------------------------------------------
    // アニメーションループ & リアルタイムチルト制御
    // -------------------------------------------------------------
    let angle = 0;
    const speed = 0.032;
    let pitchRad = 0;
    let guidesVisible = true;

    function animate() {
      requestAnimationFrame(animate);

      angle += speed;

      // 共通の仰角（X軸回転）と方位角（Y軸回転）
      // 中央
      vCenter.dancer.rotation.x = pitchRad;
      vCenter.dancer.rotation.y = angle;
      vCenter.renderer.render(vCenter.scene, vCenter.camera);

      // 左右ガイド
      if (guidesVisible) {
        vLeft.dancer.rotation.x = pitchRad;
        vLeft.dancer.rotation.y = angle;
        vLeft.renderer.render(vLeft.scene, vLeft.camera);

        vRight.dancer.rotation.x = -pitchRad; // Z反転系に合わせたチルト対称化
        vRight.dancer.rotation.y = -angle;
        vRight.renderer.render(vRight.scene, vRight.camera);
      }
    }
    animate();

    // -------------------------------------------------------------
    // インタラクティブUIロジック（スライダー・認知スイッチングタスク）
    // -------------------------------------------------------------
    // 1. チルトスライダー（仰角 -30° 〜 +30°）
    const pitchSlider = document.getElementById('pitchSlider');
    const pitchVal = document.getElementById('pitchVal');
    pitchSlider.addEventListener('input', (e) => {
      const deg = parseInt(e.target.value, 10);
      pitchRad = (deg * Math.PI) / 180;
      pitchVal.textContent = (deg > 0 ? `+${deg}°` : `${deg}°`);
    });

    // 2. 奥行きアシストスライダー（シルエット〜陰影のシームレス透過）
    const assistSlider = document.getElementById('assistSlider');
    const assistVal = document.getElementById('assistVal');
    assistSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      assistVal.textContent = `${val}%`;
      const ratio = val / 100;
      
      // 中央シルエットのマテリアルカラーを徐々に陰影付きへブレンド
      const gray = Math.round(5 + ratio * 45);
      vCenter.matCenter.color.setRGB(gray / 255, gray / 255, (gray + 5) / 255);
    });

    // 3. 知覚切り替え（認知柔軟性）カウンター
    let switchCount = 0;
    let currentDir = null;
    let lastSwitchTime = performance.now();

    const switchCountEl = document.getElementById('switchCount');
    const currentPerceptionEl = document.getElementById('currentPerception');
    const holdTimeEl = document.getElementById('holdTime');
    const btnCw = document.getElementById('btnPerceiveCw');
    const btnCcw = document.getElementById('btnPerceiveCcw');

    function recordPerception(dir) {
      const now = performance.now();
      if (currentDir !== dir) {
        if (currentDir !== null) {
          switchCount++;
          switchCountEl.textContent = switchCount;
        }
        currentDir = dir;
        currentPerceptionEl.textContent = dir === 'cw' ? '時計回り ↻' : '反時計 ↺';
        lastSwitchTime = now;
      }
      btnCw.classList.toggle('active-cw', dir === 'cw');
      btnCcw.classList.toggle('active-ccw', dir === 'ccw');
    }

    btnCw.addEventListener('click', () => recordPerception('cw'));
    btnCcw.addEventListener('click', () => recordPerception('ccw'));

    setInterval(() => {
      if (currentDir) {
        const sec = ((performance.now() - lastSwitchTime) / 1000).toFixed(1);
        holdTimeEl.textContent = `${sec}s`;
      }
    }, 100);

    // 4. ガイド表示切替
    const toggleBtn = document.getElementById('toggleGuidesBtn');
    const stage = document.getElementById('stage');
    const sideGuides = document.querySelectorAll('.side-guide');

    toggleBtn.addEventListener('click', () => {
      guidesVisible = !guidesVisible;
      sideGuides.forEach(el => el.style.display = guidesVisible ? 'flex' : 'none');
      stage.classList.toggle('guides-hidden', !guidesVisible);
      setTimeout(onResize, 40);
      toggleBtn.textContent = guidesVisible ? 'ガイド非表示' : 'ガイド表示';
    });
  </script>
</body>
</html>
