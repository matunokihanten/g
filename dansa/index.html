<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>究極の双方向錯視ラボ (Ultimate Spinning Illusion Lab)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background-color: #080a0d;
      color: #f0f3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      height: 100dvh;
      padding: env(safe-area-inset-top, 6px) 8px env(safe-area-inset-bottom, 6px) 8px;
      user-select: none;
    }

    header { width: 100%; max-width: 640px; text-align: center; flex-shrink: 0; padding-top: 2px; }
    h1 { margin: 0 0 4px; font-size: clamp(0.92rem, 3.6vw, 1.15rem); font-weight: 700; letter-spacing: 0.02em; }
    
    .status-bar {
      display: flex; justify-content: center; gap: 8px;
      font-size: clamp(0.65rem, 2.2vw, 0.75rem); color: #9ba3af; margin-top: 2px;
    }
    .badge {
      background: #15181e; border: 1px solid #282d38; padding: 3px 8px;
      border-radius: 12px; display: inline-flex; align-items: center; gap: 4px;
    }
    .badge strong { color: #58a6ff; }

    .stage {
      display: flex; gap: clamp(4px, 1.5vw, 12px); align-items: center; justify-content: center;
      width: 100%; flex: 1; min-height: 0; padding: 4px 0;
    }

    .dancer-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 0; flex: 1 1 0; max-width: 190px; }
    .dancer-container.main { flex: 1.4 1 0; max-width: 270px; }
    .stage.guides-hidden .dancer-container.main { max-width: 350px; flex: 1 1 100%; }

    .canvas-wrapper {
      width: 100%; height: calc(100% - 20px); display: flex; align-items: center; justify-content: center;
      min-height: 0; border-radius: 10px; overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #171b22 0%, #0b0d12 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06); position: relative;
    }
    .canvas-wrapper.center-bg {
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #c1c8d1 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .canvas-wrapper canvas { display: block; width: 100% !important; height: 100% !important; object-fit: contain; }

    .label { height: 18px; line-height: 18px; margin-top: 2px; font-size: clamp(0.6rem, 2vw, 0.7rem); color: #9aa0a6; text-align: center; white-space: nowrap; }
    .dancer-container.main .label { color: #ffffff; font-weight: 600; }

    /* コントロール・ドック */
    .dock-panel {
      width: 100%; max-width: 600px; background: #12141a; border: 1px solid #232833;
      border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }

    .row { display: grid; grid-template-columns: 82px 1fr 35px; align-items: center; gap: 6px; font-size: 0.7rem; color: #b5bcc9; }
    
    /* セレクトボックス（プルダウン） */
    select {
      width: 100%; padding: 4px 6px; background: #1b1f28; color: #58a6ff;
      border: 1px solid #2d3442; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; outline: none;
    }
    select:focus { border-color: #58a6ff; }

    input[type=range] { accent-color: #58a6ff; height: 4px; width: 100%; cursor: pointer; }
    .slider-val { text-align: right; font-variant-numeric: tabular-nums; color: #8c95a5; }

    .button-row { display: flex; gap: 5px; justify-content: space-between; margin-top: 2px; }
    .btn {
      flex: 1; background: #1b1e26; color: #e6edf3; border: 1px solid #323847; padding: 7px 2px;
      font-size: clamp(0.64rem, 2.1vw, 0.74rem); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s;
    }
    .btn:active { transform: scale(0.96); background: #262b36; }
    .btn.active-cw { border-color: #1e88e5; background: rgba(30, 136, 229, 0.25); color: #90caf9; }
    .btn.active-ccw { border-color: #e53935; background: rgba(229, 57, 53, 0.25); color: #ffcdd2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header>
    <h1>究極の双方向錯視ラボ</h1>
    <div class="status-bar">
      <span class="badge">視覚反転: <strong id="switchCount">0</strong>回</span>
      <span class="badge">現在認識: <strong id="currentPerception">-</strong></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="dancer-container side-guide">
      <div class="canvas-wrapper" id="wrapLeft"></div>
      <div class="label" style="color: #4da3ff;">時計回り誘導</div>
    </div>
    <div class="dancer-container main">
      <div class="canvas-wrapper center-bg" id="wrapCenter"></div>
      <div class="label"><strong>完全な錯視シルエット</strong></div>
    </div>
    <div class="dancer-container side-guide">
      <div class="canvas-wrapper" id="wrapRight"></div>
      <div class="label" style="color: #ff5252;">反時計回り誘導</div>
    </div>
  </div>

  <div class="dock-panel">
    <!-- モチーフ選択プルダウン -->
    <div class="row" style="grid-template-columns: 82px 1fr;">
      <span>モチーフ</span>
      <select id="modelSelect">
        <option value="dancer">💃 ダンサー（基本の錯視）</option>
        <option value="chair">🪑 椅子（ネッカー立体構造）</option>
        <option value="dna">🧬 3D二重らせん（上昇/下降の曖昧性）</option>
        <option value="rings">🔗 連結トーラス（メビウス的貫通）</option>
        <option value="stairs">🪜 螺旋階段（エッシャーの階段）</option>
        <option value="horse">🐎 走る馬（前後逆転ギャロップ）</option>
        <option value="gymnast">🚩 ヒューマンフラッグ（回転軸の錯覚）</option>
        <option value="windmill">🌀 3枚プロペラ（表裏の反転）</option>
      </select>
    </div>

    <!-- スライダー -->
    <div class="row">
      <span>視点仰角</span>
      <input type="range" id="pitchSlider" min="-45" max="45" value="12" step="1">
      <span class="slider-val" id="pitchVal">+12°</span>
    </div>
    <div class="row">
      <span>奥行アシスト</span>
      <input type="range" id="assistSlider" min="0" max="100" value="0" step="1">
      <span class="slider-val" id="assistVal">0%</span>
    </div>

    <!-- アクションボタン -->
    <div class="button-row">
      <button class="btn" id="btnPerceiveCw">↻ 時計回り</button>
      <button class="btn" id="btnPerceiveCcw">↺ 反時計回り</button>
      <button class="btn" id="toggleGuidesBtn" style="flex: 0.85;">ガイド非表示</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 共通マテリアル生成ファクトリ
    // -------------------------------------------------------------
    function getMaterials(mode) {
      if (mode === 'center') {
        return {
          base: new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide }),
          left: new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide }),
          right: new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide }),
          highlight: new THREE.MeshBasicMaterial({ color: 0x050505, transparent: true, opacity: 0 })
        };
      }
      return {
        base: new THREE.MeshPhongMaterial({ color: 0x222630, emissive: 0x101217, specular: 0x666f80, shininess: 30, side: THREE.DoubleSide }),
        left: new THREE.MeshPhongMaterial({ color: 0x1e88e5, emissive: 0x0d47a1, specular: 0x90caf9, shininess: 50, side: THREE.DoubleSide }),
        right: new THREE.MeshPhongMaterial({ color: 0xe53935, emissive: 0xb71c1c, specular: 0xffcdd2, shininess: 50, side: THREE.DoubleSide }),
        highlight: new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
      };
    }

    // -------------------------------------------------------------
    // 各錯視モデルのジオメトリ構築（8バリエーション）
    // -------------------------------------------------------------
    const ModelBuilders = {
      
      // 1. ダンサー（有機的曲面）
      dancer: (mats) => {
        const g = new THREE.Group();
        const makeLathe = (pts, mat) => new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])), 24), mat);
        // 頭・体
        const head = new THREE.Mesh(new THREE.SphereGeometry(3.6, 16, 16), mats.base);
        head.position.set(0, 31, 0); head.scale.set(0.9, 1.2, 1.0); g.add(head);
        g.add(makeLathe([[0,25.4], [3.6,24.5], [4.2,22.8], [3.7,21], [2.7,18.2], [4.3,13], [3.8,10.5], [0,10]], mats.base));
        // 脚
        const lLeg = makeLathe([[0,10.5], [2.4,9.5], [1.8,2.5], [1.5,0], [1.8,-4], [0.8,-12], [0,-18]], mats.left);
        lLeg.position.x = -1.5; g.add(lLeg);
        const rLegGroup = new THREE.Group();
        rLegGroup.add(makeLathe([[0,0], [2.4,-1], [1.5,-11.5]], mats.right));
        const rCalf = makeLathe([[0,0], [1.7,-4], [0.7,-15], [0,-18.5]], mats.right);
        rCalf.position.y = -11.5; rCalf.rotation.z = -0.2; rLegGroup.add(rCalf);
        rLegGroup.position.set(2, 10.5, 0.5); rLegGroup.rotation.set(0, 0.3, -1.3); g.add(rLegGroup);
        // 腕（簡略化）
        const armGeo = new THREE.CylinderGeometry(1, 0.6, 14);
        const lArm = new THREE.Mesh(armGeo, mats.left); lArm.position.set(-6, 18, -2); lArm.rotation.z = 0.6; g.add(lArm);
        const rArm = new THREE.Mesh(armGeo, mats.right); rArm.position.set(6, 18, 4); rArm.rotation.z = -0.6; g.add(rArm);
        g.position.y = -6; return g;
      },

      // 2. 椅子（ネッカー立体構造）
      chair: (mats) => {
        const g = new THREE.Group();
        const addBox = (w,h,d, mat, x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); g.add(m); return m; };
        addBox(18, 1.8, 18, mats.right, 0, 0, 0); // 座面
        [[-7.5, -7.5], [7.5, -7.5], [-7.5, 7.5], [7.5, 7.5]].forEach(p => addBox(1.5, 18, 1.5, mats.base, p[0], -9, p[1])); // 脚
        addBox(1.5, 22, 1.5, mats.base, -7.5, 11, -7.5); addBox(1.5, 22, 1.5, mats.base, 7.5, 11, -7.5); // 背もたれ柱
        addBox(16, 6, 1.5, mats.left, 0, 18, -7.5); // 背もたれ板
        g.position.y = -2; return g;
      },

      // 3. DNA（3D二重らせん）
      dna: (mats) => {
        const g = new THREE.Group();
        const path1=[], path2=[];
        for(let i=0; i<=40; i++) {
          let t = (i/40) * Math.PI * 4;
          path1.push(new THREE.Vector3(Math.cos(t)*8, i - 20, Math.sin(t)*8));
          path2.push(new THREE.Vector3(Math.cos(t+Math.PI)*8, i - 20, Math.sin(t+Math.PI)*8));
        }
        g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(path1), 64, 1.5, 8, false), mats.left));
        g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(path2), 64, 1.5, 8, false), mats.right));
        for(let i=2; i<40; i+=4) {
          const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 16), mats.base);
          rung.position.y = i - 20;
          let t = (i/40) * Math.PI * 4;
          rung.rotation.y = -t; rung.rotation.z = Math.PI/2; g.add(rung);
        }
        return g;
      },

      // 4. 連結リング（トーラス）
      rings: (mats) => {
        const g = new THREE.Group();
        const r1 = new THREE.Mesh(new THREE.TorusGeometry(10, 2, 16, 64), mats.left);
        r1.position.x = -4.5; r1.rotation.y = Math.PI/4; g.add(r1);
        const r2 = new THREE.Mesh(new THREE.TorusGeometry(10, 2, 16, 64), mats.right);
        r2.position.x = 4.5; r2.rotation.x = Math.PI/2; r2.rotation.y = -Math.PI/4; g.add(r2);
        return g;
      },

      // 5. 螺旋階段（エッシャー）
      stairs: (mats) => {
        const g = new THREE.Group();
        for(let i=0; i<20; i++) {
          const step = new THREE.Mesh(new THREE.BoxGeometry(8, 1.5, 4), i%2===0 ? mats.left : mats.right);
          let angle = i * 0.35;
          step.position.set(Math.cos(angle)*7, i*1.2 - 12, Math.sin(angle)*7);
          step.rotation.y = -angle;
          g.add(step);
        }
        return g;
      },

      // 6. 走る馬（静的ギャロップポーズの回転）
      horse: (mats) => {
        const g = new THREE.Group();
        const addBox = (w,h,d, mat, x,y,z, rx=0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.rotation.x=rx; g.add(m); return m; };
        addBox(4, 5, 18, mats.base, 0, 0, 0); // 胴体
        addBox(3, 8, 4, mats.left, 0, 5, 8, Math.PI/4); // 首
        addBox(3, 3, 6, mats.right, 0, 8, 11, Math.PI/8); // 頭
        // 脚（前方に伸ばす・後方に伸ばす）
        [[-2,2], [2,2]].forEach(x => addBox(1.5, 12, 2, mats.left, x[0], -6, 7, -Math.PI/4)); // 前脚
        [[-2,-2], [2,-2]].forEach(x => addBox(1.5, 12, 2, mats.right, x[0], -6, -7, Math.PI/4)); // 後脚
        return g;
      },

      // 7. ヒューマンフラッグ（Y軸回転のポールダンス）
      gymnast: (mats) => {
        const g = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 40), mats.highlight); g.add(pole);
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(2.5, 10), mats.base);
        body.position.set(10, 0, 0); body.rotation.z = Math.PI/2; g.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(2.5), mats.left); head.position.set(18, 0, 0); g.add(head);
        const arms = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10), mats.right);
        arms.position.set(5, 0, 0); arms.rotation.z = Math.PI/2; g.add(arms);
        const legs = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 14), mats.left);
        legs.position.set(-2, 0, 0); legs.rotation.z = Math.PI/2; g.add(legs);
        return g;
      },

      // 8. 3枚プロペラ（風車）
      windmill: (mats) => {
        const g = new THREE.Group();
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 4, 16), mats.base);
        hub.rotation.x = Math.PI/2; g.add(hub);
        for(let i=0; i<3; i++) {
          const blade = new THREE.Mesh(new THREE.BoxGeometry(3, 20, 0.6), i===0 ? mats.left : mats.right);
          blade.position.y = 12; blade.rotation.y = 0.35; // ひねり
          const pivot = new THREE.Group(); pivot.rotation.z = i * (Math.PI*2/3);
          pivot.add(blade); hub.add(pivot);
        }
        g.rotation.x = Math.PI/12; // 少し上を向かせる
        return g;
      }
    };

    // -------------------------------------------------------------
    // ビューポート初期化
    // -------------------------------------------------------------
    const frustumSize = 56;
    function createViewer(containerId, mode) {
      const container = document.getElementById(containerId);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-frustumSize/2, frustumSize/2, frustumSize/2, -frustumSize/2, 1, 1000);
      camera.position.set(0, 0, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.5);
      light.position.set(20, 30, 80); scene.add(light);
      scene.add(new THREE.AmbientLight(0x404552, 0.8));

      return { container, scene, camera, renderer, mode, mats: getMaterials(mode) };
    }

    const viewers = [
      createViewer('wrapLeft', 'cw'),
      createViewer('wrapCenter', 'center'),
      createViewer('wrapRight', 'ccw')
    ];

    function setupModel(type) {
      viewers.forEach(v => {
        if (v.rootGroup) v.scene.remove(v.rootGroup);
        const group = ModelBuilders[type](v.mats);
        
        // ★錯視の心臓部：右側モデルはZ軸反転(奥行反転)
        if (v.mode === 'ccw') group.scale.z = -1;
        
        v.rootGroup = group;
        v.scene.add(group);
      });
      onResize();
    }

    // リサイズと正射影アスペクト維持
    function onResize() {
      viewers.forEach(v => {
        const w = v.container.clientWidth; const h = v.container.clientHeight;
        if (w === 0 || h === 0) return;
        const aspect = w / h;
        v.camera.left = (-frustumSize * aspect) / 2; v.camera.right = (frustumSize * aspect) / 2;
        v.camera.top = frustumSize / 2; v.camera.bottom = -frustumSize / 2;
        v.camera.updateProjectionMatrix();
        v.renderer.setSize(w, h);
      });
    }
    window.addEventListener('resize', onResize);

    // -------------------------------------------------------------
    // アニメーションループ & チルト連動
    // -------------------------------------------------------------
    let angle = 0; const speed = 0.032;
    let pitchRad = (12 * Math.PI) / 180;
    let guidesVisible = true;

    function animate() {
      requestAnimationFrame(animate);
      angle += speed;

      viewers.forEach(v => {
        if (!v.rootGroup) return;
        if (v.mode === 'center' || guidesVisible) {
          // Z反転している右側モデル（ccw）は、回転方向も反転させることで、
          // 2Dスクリーン上への投影シルエットが中央(正方向)と【1ピクセルも狂わず完全一致】する。
          const rotDir = (v.mode === 'ccw') ? -1 : 1;
          v.rootGroup.rotation.x = pitchRad * rotDir;
          v.rootGroup.rotation.y = angle * rotDir;
          v.renderer.render(v.scene, v.camera);
        }
      });
    }
    animate();

    // -------------------------------------------------------------
    // UI イベントリスナー
    // -------------------------------------------------------------
    // プルダウン切替
    const modelSelect = document.getElementById('modelSelect');
    modelSelect.addEventListener('change', (e) => setupModel(e.target.value));
    setupModel('dancer'); // 初期ロード

    // チルト
    const pitchSlider = document.getElementById('pitchSlider');
    const pitchVal = document.getElementById('pitchVal');
    pitchSlider.addEventListener('input', (e) => {
      const deg = parseInt(e.target.value, 10);
      pitchRad = (deg * Math.PI) / 180;
      pitchVal.textContent = (deg > 0 ? `+${deg}°` : `${deg}°`);
    });

    // 奥行透過
    const assistSlider = document.getElementById('assistSlider');
    const assistVal = document.getElementById('assistVal');
    assistSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      assistVal.textContent = `${val}%`;
      const gray = Math.round(5 + (val / 100) * 48);
      viewers[1].mats.base.color.setRGB(gray/255, gray/255, (gray+5)/255);
    });

    // 知覚記録ボタン
    let switchCount = 0; let currentDir = null;
    const switchCountEl = document.getElementById('switchCount');
    const currentPerceptionEl = document.getElementById('currentPerception');
    const btnCw = document.getElementById('btnPerceiveCw');
    const btnCcw = document.getElementById('btnPerceiveCcw');

    function recordPerception(dir) {
      if (currentDir !== dir) {
        if (currentDir !== null) { switchCount++; switchCountEl.textContent = switchCount; }
        currentDir = dir;
        currentPerceptionEl.textContent = dir === 'cw' ? '時計回り ↻' : '反時計 ↺';
      }
      btnCw.classList.toggle('active-cw', dir === 'cw');
      btnCcw.classList.toggle('active-ccw', dir === 'ccw');
    }
    btnCw.addEventListener('click', () => recordPerception('cw'));
    btnCcw.addEventListener('click', () => recordPerception('ccw'));

    // ガイド表示切替
    const toggleBtn = document.getElementById('toggleGuidesBtn');
    const stage = document.getElementById('stage');
    const sideGuides = document.querySelectorAll('.side-guide');
    toggleBtn.addEventListener('click', () => {
      guidesVisible = !guidesVisible;
      sideGuides.forEach(el => el.style.display = guidesVisible ? 'flex' : 'none');
      stage.classList.toggle('guides-hidden', !guidesVisible);
      setTimeout(onResize, 40);
      toggleBtn.textContent = guidesVisible ? 'ガイド非表示' : 'ガイド表示';
    });
  </script>
</body>
</html>
