            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-200 flex items-center justify-center shadow-lg shadow-amber-500/30 text-amber-900 text-3xl">

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

    <script>
        /* ==========================================================
           1. Audio Synthesizer (Web Audio API)
           ========================================================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.2) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playCorrect() {
                try {
                    this.init();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        setTimeout(() => {
                            this.playTone(freq, 'triangle', 0.4, 0.25);
                        }, idx * 90);
                    });
                } catch(e) {}
            }
            playWrong() {
                try {
                    this.init();
                    this.playTone(140, 'sawtooth', 0.25, 0.3);
                    setTimeout(() => {
                        this.playTone(105, 'sawtooth', 0.35, 0.3);
                    }, 120);
                } catch(e) {}
            }
            playGiveUp() {
                try {
                    this.init();
                    this.playTone(392, 'sine', 0.2, 0.2);
                    setTimeout(() => this.playTone(523, 'sine', 0.3, 0.25), 150);
                } catch(e) {}
            }
        }
        const sfx = new SoundFX();

        /* ==========================================================
           2. Procedural Rubik's Cube Texture Generator
           ========================================================== */
        const RUBIK_COLORS = [
            '#C41E3A', // Red
            '#0051BA', // Blue
            '#009E60', // Green
            '#FFD500', // Yellow
            '#FF5800', // Orange
            '#FFFFFF'  // White
        ];

        function createRubikFaceTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#111215';
            ctx.fillRect(0, 0, 256, 256);

            const padding = 10;
            const gap = 8;
            const tileSize = (256 - padding * 2 - gap * 2) / 3;
            const radius = 6;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = padding + col * (tileSize + gap);
                    const y = padding + row * (tileSize + gap);
                    const color = RUBIK_COLORS[Math.floor(Math.random() * RUBIK_COLORS.length)];

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + tileSize - radius, y);
                    ctx.quadraticCurveTo(x + tileSize, y, x + tileSize, y + radius);
                    ctx.lineTo(x + tileSize, y + tileSize - radius);
                    ctx.quadraticCurveTo(x + tileSize, y + tileSize, x + tileSize - radius, y + tileSize);
                    ctx.lineTo(x + radius, y + tileSize);
                    ctx.quadraticCurveTo(x, y + tileSize, x, y + tileSize - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();

                    ctx.fillStyle = color;
                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.shadowBlur = 4;
                    ctx.fill();

                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.stroke();
                    ctx.restore();
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = true;
            return texture;
        }

        const texturePool = [];
        for (let i = 0; i < 18; i++) {
            texturePool.push(createRubikFaceTexture());
        }

        const cubeGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);

        function getRandomMaterials() {
            const mats = [];
            for (let i = 0; i < 6; i++) {
                const tex = texturePool[Math.floor(Math.random() * texturePool.length)];
                mats.push(new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 0.28,
                    metalness: 0.1,
                }));
            }
            return mats;
        }

        /* ==========================================================
           3. Game State & Elements
           ========================================================== */
        const state = {
            cubeCount: 200,
            cubes: [],
            targetCube: null,
            targetIndex: -1,
            isGameOver: false,
            startTime: null,
            elapsedSeconds: 0,
            timerInterval: null,
            missCount: 0,
            pointerDownPos: { x: 0, y: 0 },
            pointerDownTime: 0
        };

        const container = document.getElementById('canvas-container');
        const timerDisplay = document.getElementById('timer-display');
        const statusDisplay = document.getElementById('status-display');
        const cubeCountLabel = document.getElementById('cube-count-label');
        const btnRestart = document.getElementById('btn-restart');
        const btnGiveUp = document.getElementById('btn-giveup');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        const winModal = document.getElementById('win-modal');
        const winCard = document.getElementById('win-card');
        const modalTime = document.getElementById('modal-time');
        const modalMiss = document.getElementById('modal-miss');
        const modalBtnRestart = document.getElementById('modal-btn-restart');
        const modalBtnShare = document.getElementById('modal-btn-share');
        const diffButtons = document.querySelectorAll('.diff-btn');

        /* ==========================================================
           4. Three.js Scene Setup
           ========================================================== */
        let scene, camera, renderer, controls, raycaster, mouse;
        let goldRing = null;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c1022);
            scene.fog = new THREE.FogExp2(0x0c1022, 0.012);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(48, aspect, 0.1, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.domElement.style.touchAction = 'none';
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.rotateSpeed = 1.4;
            controls.zoomSpeed = 1.0;
            controls.panSpeed = 0.8;
            controls.maxDistance = 85;
            controls.minDistance = 6;
            controls.touches = {
                ONE: THREE.TOUCH.ROTATE,
                TWO: THREE.TOUCH.DOLLY_PAN
            };

            updateCameraPosition();

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight1.position.set(20, 40, 30);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x70a5ff, 0.6);
            dirLight2.position.set(-30, -20, -20);
            scene.add(dirLight2);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
        }

        function updateCameraPosition() {
            if (window.innerWidth < 640) {
                camera.position.set(0, 10, 38);
                if (controls) controls.target.set(0, -1.8, 0);
            } else {
                camera.position.set(0, 12, 28);
                if (controls) controls.target.set(0, -1.0, 0);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeConfettiCanvas();
        }

        /* ==========================================================
           5. Timer & Toast UI
           ========================================================== */
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const tenths = Math.floor((seconds % 1) * 10);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(state.elapsedSeconds);
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.startTime = Date.now();
            state.timerInterval = setInterval(() => {
                if (!state.isGameOver) {
                    state.elapsedSeconds = (Date.now() - state.startTime) / 1000;
                    updateTimerDisplay();
                }
            }, 100);
        }

        let toastTimeout = null;
        function showToast(text) {
            toastMsg.textContent = text;
            toast.classList.remove('opacity-0', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2');
            }, 1800);
        }

        /* ==========================================================
           6. Game Generation
           ========================================================== */
        function generateGame() {
            state.cubes.forEach(c => {
                scene.remove(c.mesh);
            });
            state.cubes = [];
            if (goldRing) {
                scene.remove(goldRing);
                goldRing = null;
            }

            state.isGameOver = false;
            state.missCount = 0;
            state.elapsedSeconds = 0;
            statusDisplay.textContent = '0/1';
            cubeCountLabel.textContent = `${state.cubeCount}個の中に1つだけ！`;

            const targetY = (window.innerWidth < 640) ? -1.8 : -1.0;
            controls.target.set(0, targetY, 0);
            controls.enabled = true;

            state.targetIndex = Math.floor(Math.random() * state.cubeCount);

            const count = state.cubeCount;
            const isMobile = window.innerWidth < 640;
            const spreadX = isMobile ? 12 : 20;
            const spreadY = isMobile ? 18 : 13;
            const spreadZ = 16;
            const yOffset = isMobile ? -2.0 : -1.2;

            for (let i = 0; i < count; i++) {
                const materials = getRandomMaterials();
                const mesh = new THREE.Mesh(cubeGeometry, materials);

                const posX = (Math.random() - 0.5) * spreadX * 2.0;
                const posY = (Math.random() - 0.5) * spreadY * 1.8 + yOffset;
                const posZ = (Math.random() - 0.5) * spreadZ * 1.4;
                mesh.position.set(posX, posY, posZ);

                mesh.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );

                const isTarget = (i === state.targetIndex);

                const minSpeed = 0.012;
                const maxSpeed = 0.038;
                const signX = Math.random() > 0.5 ? 1 : -1;
                const signY = Math.random() > 0.5 ? 1 : -1;
                const signZ = Math.random() > 0.5 ? 1 : -1;

                const rotSpeed = isTarget ? { x: 0, y: 0, z: 0 } : {
                    x: signX * (minSpeed + Math.random() * (maxSpeed - minSpeed)),
                    y: signY * (minSpeed + Math.random() * (maxSpeed - minSpeed)),
                    z: signZ * (minSpeed * 0.5 + Math.random() * 0.01)
                };

                const cubeData = {
                    mesh: mesh,
                    isTarget: isTarget,
                    rotSpeed: rotSpeed,
                    originalMaterials: materials,
                    flashTimer: 0
                };

                mesh.userData = cubeData;
                scene.add(mesh);
                state.cubes.push(cubeData);

                if (isTarget) {
                    state.targetCube = cubeData;
                }
            }

            startTimer();
        }

        /* ==========================================================
           7. Win & Loss Handlers
           ========================================================== */
        function onMiss(cubeData) {
            sfx.playWrong();
            state.missCount++;
            state.startTime -= 3000;
            state.elapsedSeconds += 3;
            updateTimerDisplay();
            showToast('動いています！ (+3秒)');

            const redMat = new THREE.MeshBasicMaterial({ color: 0xff1e3a });
            cubeData.mesh.material = [redMat, redMat, redMat, redMat, redMat, redMat];
            cubeData.flashTimer = 0.35;
        }

        function onSuccess(cubeData, isSurrender = false) {
            state.isGameOver = true;
            clearInterval(state.timerInterval);
            statusDisplay.textContent = '1/1';

            highlightTargetCube(cubeData.mesh);

            if (!isSurrender) {
                sfx.playCorrect();
                fireConfetti();
                setTimeout(() => showVictoryModal(), 900);
            } else {
                sfx.playGiveUp();
                showToast('動かないキューブはこれでした！');
            }

            focusCameraOnTarget(cubeData.mesh.position);
        }

        function highlightTargetCube(mesh) {
            const goldMaterials = [];
            for (let i = 0; i < 6; i++) {
                goldMaterials.push(new THREE.MeshStandardMaterial({
                    color: 0xffd700,
                    emissive: 0xffaa00,
                    emissiveIntensity: 0.6,
                    roughness: 0.2,
                    metalness: 0.7
                }));
            }
            mesh.material = goldMaterials;

            if (!goldRing) {
                const ringGeo = new THREE.TorusGeometry(1.6, 0.08, 16, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xffea00,
                    transparent: true,
                    opacity: 0.9
                });
                goldRing = new THREE.Mesh(ringGeo, ringMat);
                scene.add(goldRing);
            }
            goldRing.position.copy(mesh.position);
            goldRing.scale.set(1, 1, 1);
        }

        function focusCameraOnTarget(targetPos) {
            const offset = new THREE.Vector3(2.5, 2.5, 4.5);
            const targetCamPos = targetPos.clone().add(offset);

            let progress = 0;
            const startCamPos = camera.position.clone();
            const startControlsTarget = controls.target.clone();

            function animZoom() {
                progress += 0.035;
                if (progress <= 1) {
                    camera.position.lerpVectors(startCamPos, targetCamPos, easeOutQuad(progress));
                    controls.target.lerpVectors(startControlsTarget, targetPos, easeOutQuad(progress));
                    requestAnimationFrame(animZoom);
                } else {
                    camera.position.copy(targetCamPos);
                    controls.target.copy(targetPos);
                }
            }
            animZoom();
        }

        function easeOutQuad(t) {
            return t * (2 - t);
        }

        function showVictoryModal() {
            modalTime.textContent = formatTime(state.elapsedSeconds);
            modalMiss.textContent = `${state.missCount}回`;

            winModal.classList.remove('opacity-0', 'pointer-events-none');
            winModal.classList.add('opacity-100');
            winCard.classList.remove('scale-95');
            winCard.classList.add('scale-100');
        }

        function hideVictoryModal() {
            winModal.classList.add('opacity-0', 'pointer-events-none');
            winModal.classList.remove('opacity-100');
            winCard.classList.add('scale-95');
            winCard.classList.remove('scale-100');
        }

        /* ==========================================================
           8. Pointer & Tap Handler
           ========================================================== */
        function onPointerDown(e) {
            state.pointerDownPos = { x: e.clientX, y: e.clientY };
            state.pointerDownTime = Date.now();
            sfx.init();
        }

        function onPointerUp(e) {
            const deltaX = Math.abs(e.clientX - state.pointerDownPos.x);
            const deltaY = Math.abs(e.clientY - state.pointerDownPos.y);
            const distance = Math.hypot(deltaX, deltaY);
            const deltaTime = Date.now() - state.pointerDownTime;

            if (distance < 8 && deltaTime < 450) {
                handleTap(e.clientX, e.clientY);
            }
        }

        function handleTap(clientX, clientY) {
            if (state.isGameOver) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = state.cubes.map(c => c.mesh);
            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const cubeData = hitMesh.userData;

                if (cubeData.isTarget) {
                    onSuccess(cubeData, false);
                } else {
                    onMiss(cubeData);
                }
            }
        }

        /* ==========================================================
           9. Confetti Particle System
           ========================================================== */
        const confettiCanvas = document.getElementById('confetti-canvas');
        const cCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiActive = false;

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfettiCanvas();

        function fireConfetti() {
            confettiParticles = [];
            confettiActive = true;
            const colors = ['#f59e0b', '#ec4899', '#3b82f6', '#10b981', '#fbbf24', '#ffffff'];

            for (let i = 0; i < 90; i++) {
                confettiParticles.push({
                    x: confettiCanvas.width * 0.5 + (Math.random() - 0.5) * 80,
                    y: confettiCanvas.height * 0.5 + (Math.random() - 0.5) * 80,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 1.2) * 16 - 3,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }
        }

        function updateConfetti() {
            if (!confettiActive) return;
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            let alive = 0;
            confettiParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.vx *= 0.985;
                p.rot += p.rotSpeed;

                if (p.y > confettiCanvas.height * 0.6) {
                    p.opacity -= 0.018;
                }

                if (p.opacity > 0) {
                    alive++;
                    cCtx.save();
                    cCtx.translate(p.x, p.y);
                    cCtx.rotate((p.rot * Math.PI) / 180);
                    cCtx.fillStyle = p.color;
                    cCtx.globalAlpha = Math.max(0, p.opacity);
                    cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    cCtx.restore();
                }
            });

            if (alive === 0) {
                confettiActive = false;
                cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        /* ==========================================================
           10. Main Animation Loop
           ========================================================== */
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            state.cubes.forEach(c => {
                if (!c.isTarget) {
                    c.mesh.rotation.x += c.rotSpeed.x;
                    c.mesh.rotation.y += c.rotSpeed.y;
                    c.mesh.rotation.z += c.rotSpeed.z;
                }

                if (c.flashTimer > 0) {
                    c.flashTimer -= delta;
                    if (c.flashTimer <= 0) {
                        c.mesh.material = c.originalMaterials;
                    }
                }
            });

            if (goldRing) {
                goldRing.rotation.x += 0.02;
                goldRing.rotation.y += 0.03;
                const scale = 1 + Math.sin(now * 0.006) * 0.12;
                goldRing.scale.set(scale, scale, scale);
            }

            controls.update();
            renderer.render(scene, camera);
            updateConfetti();
        }

        /* ==========================================================
           11. Event Listeners & UI Binding
           ========================================================== */
        const btnToggleUI = document.getElementById('btn-toggle-ui');
        const collapsibleToolbar = document.getElementById('collapsible-toolbar');
        const uiToggleIcon = document.getElementById('ui-toggle-icon');
        const btnResetView = document.getElementById('btn-reset-view');
        let isUICollapsed = false;

        btnToggleUI.addEventListener('click', () => {
            isUICollapsed = !isUICollapsed;
            if (isUICollapsed) {
                collapsibleToolbar.style.maxHeight = '0px';
                collapsibleToolbar.style.opacity = '0';
                collapsibleToolbar.style.pointerEvents = 'none';
                uiToggleIcon.classList.remove('fa-chevron-up');
                uiToggleIcon.classList.add('fa-chevron-down');
            } else {
                collapsibleToolbar.style.maxHeight = '100px';
                collapsibleToolbar.style.opacity = '1';
                collapsibleToolbar.style.pointerEvents = 'auto';
                uiToggleIcon.classList.remove('fa-chevron-down');
                uiToggleIcon.classList.add('fa-chevron-up');
            }
        });

        btnResetView.addEventListener('click', () => {
            updateCameraPosition();
            controls.update();
        });

        btnRestart.addEventListener('click', () => {
            sfx.init();
            hideVictoryModal();
            generateGame();
        });

        btnGiveUp.addEventListener('click', () => {
            if (state.isGameOver) return;
            onSuccess(state.targetCube, true);
        });

        modalBtnRestart.addEventListener('click', () => {
            hideVictoryModal();
            generateGame();
        });

        modalBtnShare.addEventListener('click', () => {
            const timeStr = formatTime(state.elapsedSeconds);
            const text = `【動かないキューブはどれ？】\n${state.cubeCount}個の中から動かないキューブを【${timeStr}】(ミス${state.missCount}回) で発見しました！✨\n#動かないキューブゲーム #脳トレ`;
            
            try {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast('結果をクリップボードにコピーしました！');
            } catch(e) {
                showToast('コピーに失敗しました');
            }
        });

        diffButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                diffButtons.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow');
                    b.classList.add('text-gray-300');
                });
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow');
                btn.classList.remove('text-gray-300');

                state.cubeCount = parseInt(btn.dataset.count);
                hideVictoryModal();
                generateGame();
            });
        });

        /* ==========================================================
           12. Window Onload Initialization
           ========================================================== */
        window.onload = function () {
            initScene();
            generateGame();
            animate();
        };
    </script>
</body>
</html>
