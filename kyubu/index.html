    <script>
        /* ==========================================================
           1. Audio Synthesizer (Web Audio API - 完全自前音源)
           ========================================================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.2) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playCorrect() {
                try {
                    this.init();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        setTimeout(() => this.playTone(freq, 'triangle', 0.35, 0.22), idx * 80);
                    });
                } catch(e) {}
            }
            playWrong() {
                try {
                    this.init();
                    this.playTone(150, 'sawtooth', 0.2, 0.25);
                    setTimeout(() => this.playTone(110, 'sawtooth', 0.28, 0.25), 110);
                } catch(e) {}
            }
            playGiveUp() {
                try {
                    this.init();
                    this.playTone(440, 'sine', 0.15, 0.2);
                    setTimeout(() => this.playTone(660, 'sine', 0.3, 0.2), 120);
                } catch(e) {}
            }
        }
        const sfx = new SoundFX();

        /* ==========================================================
           2. Procedural Rubik's Cube Face Texture Generator (Canvas 2D)
           ========================================================== */
        const RUBIK_COLORS = ['#C41E3A', '#0051BA', '#009E60', '#FFD500', '#FF5800', '#FFFFFF'];
        const texturePool = [];

        function generateTextures() {
            for (let t = 0; t < 14; t++) {
                const cv = document.createElement('canvas');
                cv.width = 256;
                cv.height = 256;
                const ctx = cv.getContext('2d');

                // 黒目地ベース
                ctx.fillStyle = '#111318';
                ctx.fillRect(0, 0, 256, 256);

                const padding = 10;
                const gap = 8;
                const tileSize = (256 - padding * 2 - gap * 2) / 3;
                const radius = 6;

                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        const x = padding + c * (tileSize + gap);
                        const y = padding + r * (tileSize + gap);
                        const color = RUBIK_COLORS[Math.floor(Math.random() * RUBIK_COLORS.length)];

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(x + radius, y);
                        ctx.lineTo(x + tileSize - radius, y);
                        ctx.quadraticCurveTo(x + tileSize, y, x + tileSize, y + radius);
                        ctx.lineTo(x + tileSize, y + tileSize - radius);
                        ctx.quadraticCurveTo(x + tileSize, y + tileSize, x + tileSize - radius, y + tileSize);
                        ctx.lineTo(x + radius, y + tileSize);
                        ctx.quadraticCurveTo(x, y + tileSize, x, y + tileSize - radius);
                        ctx.lineTo(x, y + radius);
                        ctx.quadraticCurveTo(x, y, x + radius, y);
                        ctx.closePath();

                        ctx.fillStyle = color;
                        ctx.shadowColor = 'rgba(0,0,0,0.45)';
                        ctx.shadowBlur = 4;
                        ctx.fill();

                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                const texture = new THREE.CanvasTexture(cv);
                texture.generateMipmaps = true;
                texturePool.push(texture);
            }
        }

        // キューブのサイズを大型（3.3）に最適化し、最高200個でも密集しすぎず迫力と視認性を両立
        const cubeGeometry = new THREE.BoxGeometry(3.3, 3.3, 3.3);

        function getRandomCubeMaterials() {
            const mats = [];
            for (let i = 0; i < 6; i++) {
                const tex = texturePool[Math.floor(Math.random() * texturePool.length)];
                mats.push(new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 0.3,
                    metalness: 0.1
                }));
            }
            return mats;
        }

        /* ==========================================================
           3. Zero-Dependency 3D Orbit & Auto-Rotate Camera Controller
              (外部CDNに一切依存せずスマホ・PCで滑らかに動作)
           ========================================================== */
        class CustomOrbitControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.dom = domElement;
                this.target = new THREE.Vector3(0, -1.2, 0);

                // 球面座標パラメータ
                this.radius = 36;
                this.targetRadius = 36;
                this.theta = 0;          // 水平回転角
                this.targetTheta = 0;
                this.phi = Math.PI / 2.3; // 垂直回転角
                this.targetPhi = Math.PI / 2.3;

                this.autoRotate = true;
                this.autoRotateSpeed = 0.005; // 滑らかな自動旋回
                this.isPointerDown = false;
                this.isDragging = false;

                this.lastPointerX = 0;
                this.lastPointerY = 0;
                this.pointerDownX = 0;
                this.pointerDownY = 0;
                this.pointerDownTime = 0;

                this.touchStartDist = 0;

                this.initEvents();
            }

            initEvents() {
                // Pointer Events (Mouse & Single Touch)
                this.dom.addEventListener('pointerdown', (e) => this.onPointerDown(e), { passive: false });
                window.addEventListener('pointermove', (e) => this.onPointerMove(e), { passive: false });
                window.addEventListener('pointerup', (e) => this.onPointerUp(e), { passive: false });
                window.addEventListener('pointercancel', (e) => this.onPointerUp(e), { passive: false });

                // Wheel Zoom
                this.dom.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    this.targetRadius += e.deltaY * 0.03;
                    this.targetRadius = Math.max(16, Math.min(140, this.targetRadius));
                }, { passive: false });

                // Touch Pinch Zoom
                this.dom.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.touchStartDist = Math.hypot(dx, dy);
                    }
                }, { passive: true });

                this.dom.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        if (this.touchStartDist > 0) {
                            const delta = (this.touchStartDist - dist) * 0.08;
                            this.targetRadius = Math.max(16, Math.min(140, this.targetRadius + delta));
                        }
                        this.touchStartDist = dist;
                    }
                }, { passive: true });
            }

            onPointerDown(e) {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                this.isPointerDown = true;
                this.isDragging = false;
                this.lastPointerX = e.clientX;
                this.lastPointerY = e.clientY;
                this.pointerDownX = e.clientX;
                this.pointerDownY = e.clientY;
                this.pointerDownTime = performance.now();
            }

            onPointerMove(e) {
                if (!this.isPointerDown) return;
                const dx = e.clientX - this.lastPointerX;
                const dy = e.clientY - this.lastPointerY;
                const totalDist = Math.hypot(e.clientX - this.pointerDownX, e.clientY - this.pointerDownY);

                if (totalDist > 7) {
                    this.isDragging = true;
                }

                if (this.isDragging) {
                    // 指スワイプで素早く快適に回転
                    const rotateSpeed = 0.007;
                    this.targetTheta -= dx * rotateSpeed;
                    this.targetPhi -= dy * rotateSpeed;
                    // 上下反転防止のリミット
                    this.targetPhi = Math.max(0.15, Math.min(Math.PI - 0.15, this.targetPhi));
                }

                this.lastPointerX = e.clientX;
                this.lastPointerY = e.clientY;
            }

            onPointerUp(e) {
                if (!this.isPointerDown) return;
                const totalDist = Math.hypot(e.clientX - this.pointerDownX, e.clientY - this.pointerDownY);
                const duration = performance.now() - this.pointerDownTime;
                this.isPointerDown = false;

                // スワイプ移動が7px未満かつ短時間ならタップと判定
                if (!this.isDragging && totalDist < 8 && duration < 380) {
                    handleTap(e.clientX, e.clientY);
                }
                this.isDragging = false;
            }

            resetFront() {
                this.targetTheta = 0;
                this.targetPhi = Math.PI / 2.3;
                fitCameraDistance();
            }

            update() {
                // 自動回転がONなら、指で触っていない間は止まらずに自動旋回を継続
                if (this.autoRotate && !this.isPointerDown) {
                    this.targetTheta += this.autoRotateSpeed;
                }

                // 滑らかなダンピング補間 (Lerp)
                this.theta += (this.targetTheta - this.theta) * 0.1;
                this.phi += (this.targetPhi - this.phi) * 0.1;
                this.radius += (this.targetRadius - this.radius) * 0.1;

                // 球面座標からカメラのXYZ座標を算出
                const sinPhiRadius = Math.sin(this.phi) * this.radius;
                this.camera.position.x = this.target.x + sinPhiRadius * Math.sin(this.theta);
                this.camera.position.y = this.target.y + Math.cos(this.phi) * this.radius;
                this.camera.position.z = this.target.z + sinPhiRadius * Math.cos(this.theta);

                this.camera.lookAt(this.target);
            }
        }

        /* ==========================================================
           4. Game State & Elements
           ========================================================== */
        const state = {
            cubeCount: 100,
            stage: 1,
            cubes: [],
            targetCube: null,
            targetIndex: -1,
            isGameOver: false,
            isTransitioning: false,
            startTime: null,
            elapsedSeconds: 0,
            timerInterval: null,
            missCount: 0
        };

        // DOM Elements
        const canvasContainer = document.getElementById('canvas-container');
        const webglCanvas = document.getElementById('webgl-canvas');
        const stageDisplay = document.getElementById('stage-display');
        const timerDisplay = document.getElementById('timer-display');
        const cubeCountLabel = document.getElementById('cube-count-label');
        const successBanner = document.getElementById('success-banner');
        const successStageText = document.getElementById('success-stage-text');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');

        const btnRestart = document.getElementById('btn-restart');
        const btnToggleUI = document.getElementById('btn-toggle-ui');
        const uiToggleIcon = document.getElementById('ui-toggle-icon');
        const collapsibleToolbar = document.getElementById('collapsible-toolbar');
        const btnGiveUp = document.getElementById('btn-giveup');
        const btnResetView = document.getElementById('btn-reset-view');
        const btnAutoRotate = document.getElementById('btn-auto-rotate');
        const autoRotateIcon = document.getElementById('auto-rotate-icon');
        const autoRotateText = document.getElementById('auto-rotate-text');
        const diffButtons = document.querySelectorAll('.diff-btn');

        /* ==========================================================
           5. Three.js Scene Setup & Frustum-Fitting
           ========================================================== */
        let scene, camera, renderer, customControls, raycaster, mouse;
        let goldRing = null;

        // キューブ群の拡がりサイズを保持
        let currentFieldBounds = { rx: 20, ry: 25, rz: 20, maxR: 25 };

        function calculateFieldBounds(count, aspect) {
            // 最大200個でも画面全体に美しく広がるよう、縦横比と個数に合わせて最適配分
            const baseR = Math.cbrt(count) * 6.5;
            const rx = aspect < 0.75 ? baseR * 1.15 : baseR * 1.5;
            const ry = aspect < 0.75 ? baseR * 1.95 : baseR * 1.25;
            const rz = baseR * 1.35;
            const maxR = Math.max(rx, ry, rz);
            return { rx, ry, rz, maxR };
        }

        function fitCameraDistance() {
            if (!camera || !customControls) return;
            const aspect = window.innerWidth / window.innerHeight;
            currentFieldBounds = calculateFieldBounds(state.cubeCount, aspect);

            // カメラを引きすぎず、画面いっぱいにキューブが迫る距離を算出
            const effectiveFovTan = Math.tan((camera.fov * Math.PI) / 360);
            const distY = (currentFieldBounds.ry * 0.94) / effectiveFovTan;
            const distX = (currentFieldBounds.rx * 0.94) / (effectiveFovTan * aspect);

            // 個数に応じた最適カメラ距離
            const optimalDist = Math.max(distY, distX, 25);
            customControls.targetRadius = optimalDist;

            // スマホ縦画面でもヘッダーに被らないよう中心を微調整
            const yTarget = aspect < 0.75 ? -1.2 : -0.5;
            customControls.target.set(0, yTarget, 0);
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f1e);
            scene.fog = new THREE.FogExp2(0x0b0f1e, 0.0035);

            const aspect = window.innerWidth / window.innerHeight;
            // FOVを50度に広げて視野のダイナミック感を向上
            camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 400);

            renderer = new THREE.WebGLRenderer({
                canvas: webglCanvas,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            customControls = new CustomOrbitControls(camera, webglCanvas);
            fitCameraDistance();
            customControls.update();

            // ライティング
            const ambient = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambient);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight1.position.set(25, 45, 30);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x75a0ff, 0.65);
            dirLight2.position.set(-30, -20, -25);
            scene.add(dirLight2);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            fitCameraDistance();
            resizeConfetti();
        }

        /* ==========================================================
           6. Timer & Toast UI
           ========================================================== */
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            const ms = Math.floor((sec % 1) * 10);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.startTime = performance.now();
            state.timerInterval = setInterval(() => {
                if (!state.isGameOver) {
                    state.elapsedSeconds = (performance.now() - state.startTime) / 1000;
                    timerDisplay.textContent = formatTime(state.elapsedSeconds);
                }
            }, 100);
        }

        let toastTimeout = null;
        function showToast(text) {
            toastMsg.textContent = text;
            toast.classList.remove('opacity-0', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2');
            }, 1800);
        }

        /* ==========================================================
           7. Target Highlight Effect (ゴールドリング＆発光)
           ========================================================== */
        function createTargetHighlight(targetMesh) {
            if (goldRing) {
                scene.remove(goldRing);
                goldRing = null;
            }

            // キューブ大型化（3.3）に合わせてリングサイズを調整 (4.6)
            const ringGeo = new THREE.TorusGeometry(4.6, 0.2, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xffdf00,
                wireframe: false,
                transparent: true,
                opacity: 0.9
            });
            goldRing = new THREE.Mesh(ringGeo, ringMat);
            goldRing.position.copy(targetMesh.position);
            scene.add(goldRing);

            const goldMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            targetMesh.material = [goldMat, goldMat, goldMat, goldMat, goldMat, goldMat];
        }

        /* ==========================================================
           8. Game Generation (新ステージ生成)
           ========================================================== */
        function generateGame(isNextStage = false) {
            state.cubes.forEach(c => scene.remove(c.mesh));
            state.cubes = [];
            if (goldRing) {
                scene.remove(goldRing);
                goldRing = null;
            }

            if (isNextStage) {
                state.stage++;
            } else {
                state.stage = 1;
                state.elapsedSeconds = 0;
                timerDisplay.textContent = '00:00.0';
            }

            state.isGameOver = false;
            state.isTransitioning = false;
            state.missCount = 0;
            stageDisplay.textContent = `STAGE ${state.stage}`;
            cubeCountLabel.textContent = `${state.cubeCount}個の中に1つだけ！`;

            state.targetIndex = Math.floor(Math.random() * state.cubeCount);

            const count = state.cubeCount;
            fitCameraDistance();

            const bounds = currentFieldBounds;
            const yOffset = customControls ? customControls.target.y : -1.0;

            // 最大200個でもキューブが重なり合わないよう個数に応じた最小距離を設定
            const minSpacing = count <= 50 ? 5.8 : (count <= 100 ? 5.2 : 4.8);
            const minSpacingSq = minSpacing * minSpacing;

            // 多層シェル＋フィボナッチ球面サンプリングで画面全体に立体的に散布
            const numShells = count <= 50 ? 3 : (count <= 100 ? 4 : 5);

            const shellRadii = [];
            let totalWeight = 0;
            for (let s = 0; s < numShells; s++) {
                const rFrac = 0.35 + (s / Math.max(1, numShells - 1)) * 0.65;
                shellRadii.push(rFrac);
                totalWeight += rFrac * rFrac;
            }

            let remaining = count;
            const shellCounts = [];
            for (let s = 0; s < numShells; s++) {
                if (s === numShells - 1) {
                    shellCounts.push(remaining);
                } else {
                    const c = Math.max(3, Math.round(count * (shellRadii[s] * shellRadii[s]) / totalWeight));
                    shellCounts.push(c);
                    remaining -= c;
                }
            }

            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            const generatedPositions = [];

            for (let s = 0; s < numShells; s++) {
                const nPoints = shellCounts[s];
                const rFrac = shellRadii[s];
                const rotOffset = Math.random() * Math.PI * 2;

                for (let j = 0; j < nPoints; j++) {
                    const yNorm = 1 - (j / Math.max(1, nPoints - 1)) * 2;
                    const radiusAtY = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
                    const phi = j * goldenAngle + rotOffset;

                    const jitterR = rFrac + (Math.random() - 0.5) * 0.08;
                    const px = Math.cos(phi) * radiusAtY * bounds.rx * jitterR;
                    const py = yNorm * bounds.ry * jitterR + yOffset;
                    const pz = Math.sin(phi) * radiusAtY * bounds.rz * jitterR;

                    let posValid = true;
                    for (let p = 0; p < generatedPositions.length; p++) {
                        const gp = generatedPositions[p];
                        const dx = px - gp.x;
                        const dy = py - gp.y;
                        const dz = pz - gp.z;
                        if (dx * dx + dy * dy + dz * dz < minSpacingSq) {
                            posValid = false;
                            break;
                        }
                    }

                    let finalX = px;
                    let finalY = py;
                    let finalZ = pz;

                    if (!posValid) {
                        for (let attempt = 0; attempt < 8; attempt++) {
                            const testX = px + (Math.random() - 0.5) * 4.0;
                            const testY = py + (Math.random() - 0.5) * 4.0;
                            const testZ = pz + (Math.random() - 0.5) * 4.0;
                            let ok = true;
                            for (let p = 0; p < generatedPositions.length; p++) {
                                const gp = generatedPositions[p];
                                const ddx = testX - gp.x;
                                const ddy = testY - gp.y;
                                const ddz = testZ - gp.z;
                                if (ddx * ddx + ddy * ddy + ddz * ddz < minSpacingSq * 0.85) {
                                    ok = false;
                                    break;
                                }
                            }
                            if (ok) {
                                finalX = testX;
                                finalY = testY;
                                finalZ = testZ;
                                break;
                            }
                        }
                    }

                    generatedPositions.push({ x: finalX, y: finalY, z: finalZ });
                }
            }

            // キューブの作成とシーンへの配置
            for (let i = 0; i < count; i++) {
                const materials = getRandomCubeMaterials();
                const mesh = new THREE.Mesh(cubeGeometry, materials);

                const pos = generatedPositions[i] || {
                    x: (Math.random() - 0.5) * bounds.rx,
                    y: (Math.random() - 0.5) * bounds.ry + yOffset,
                    z: (Math.random() - 0.5) * bounds.rz
                };

                mesh.position.set(pos.x, pos.y, pos.z);
                mesh.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );

                const isTarget = (i === state.targetIndex);

                let rotSpeed = { x: 0, y: 0, z: 0 };
                if (!isTarget) {
                    const minSpd = 0.015;
                    const maxSpd = 0.040;
                    const sx = Math.random() > 0.5 ? 1 : -1;
                    const sy = Math.random() > 0.5 ? 1 : -1;
                    const sz = Math.random() > 0.5 ? 1 : -1;
                    rotSpeed = {
                        x: sx * (minSpd + Math.random() * (maxSpd - minSpd)),
                        y: sy * (minSpd + Math.random() * (maxSpd - minSpd)),
                        z: sz * (minSpd * 0.6 + Math.random() * 0.01)
                    };
                }

                const cubeData = {
                    mesh: mesh,
                    isTarget: isTarget,
                    rotSpeed: rotSpeed,
                    originalMaterials: materials,
                    flashTimer: 0
                };

                mesh.userData = cubeData;
                scene.add(mesh);
                state.cubes.push(cubeData);

                if (isTarget) {
                    state.targetCube = cubeData;
                }
            }

            startTimer();
        }

        /* ==========================================================
           9. Tap Handling & Progression
           ========================================================== */
        function handleTap(clientX, clientY) {
            if (state.isGameOver || state.isTransitioning) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = state.cubes.map(c => c.mesh);
            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const cubeData = hitMesh.userData;

                if (cubeData.isTarget) {
                    onTargetFound(cubeData);
                } else {
                    onTargetMiss(cubeData);
                }
            }
        }

        function onTargetMiss(cubeData) {
            sfx.playWrong();
            state.missCount++;
            state.startTime -= 3000; // 3秒ペナルティ加算
            state.elapsedSeconds += 3;
            timerDisplay.textContent = formatTime(state.elapsedSeconds);
            showToast('動いています！ (+3秒)');

            const redMat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
            cubeData.mesh.material = [redMat, redMat, redMat, redMat, redMat, redMat];
            cubeData.flashTimer = 0.35;
        }

        function onTargetFound(cubeData) {
            state.isTransitioning = true;
            state.isGameOver = true;

            sfx.playCorrect();
            createTargetHighlight(cubeData.mesh);
            fireConfetti();

            successStageText.textContent = `STAGE ${state.stage} クリア！ 次へ進みます...`;
            successBanner.classList.remove('opacity-0', 'scale-90');
            successBanner.classList.add('opacity-100', 'scale-100');

            // 1.2秒後に自動で次ステージへスムーズに移行！
            setTimeout(() => {
                successBanner.classList.remove('opacity-100', 'scale-100');
                successBanner.classList.add('opacity-0', 'scale-90');
                generateGame(true);
            }, 1200);
        }

        function giveUpAndShowTarget() {
            if (state.isGameOver || !state.targetCube) return;
            state.isGameOver = true;
            sfx.playGiveUp();
            createTargetHighlight(state.targetCube.mesh);
            showToast('動かないキューブはこれでした！');
            setTimeout(() => {
                generateGame(false);
            }, 2500);
        }

        /* ==========================================================
           10. Confetti Particles (完全自前 2D Canvas)
           ========================================================== */
        const confettiCanvas = document.getElementById('confetti-canvas');
        const cCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiActive = false;

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfetti();

        function fireConfetti() {
            confettiParticles = [];
            confettiActive = true;
            const colors = ['#f59e0b', '#ec4899', '#3b82f6', '#10b981', '#fbbf24', '#ffffff'];

            for (let i = 0; i < 85; i++) {
                confettiParticles.push({
                    x: confettiCanvas.width * 0.5 + (Math.random() - 0.5) * 60,
                    y: confettiCanvas.height * 0.5 + (Math.random() - 0.5) * 60,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 1.2) * 16 - 2,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }
        }

        function updateConfetti() {
            if (!confettiActive) return;
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            let alive = 0;
            confettiParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.vx *= 0.985;
                p.rot += p.rotSpeed;

                if (p.y > confettiCanvas.height * 0.6) {
                    p.opacity -= 0.02;
                }

                if (p.opacity > 0) {
                    alive++;
                    cCtx.save();
                    cCtx.translate(p.x, p.y);
                    cCtx.rotate((p.rot * Math.PI) / 180);
                    cCtx.fillStyle = p.color;
                    cCtx.globalAlpha = Math.max(0, p.opacity);
                    cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    cCtx.restore();
                }
            });

            if (alive === 0) {
                confettiActive = false;
                cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        /* ==========================================================
           11. Main Render & Animation Loop
           ========================================================== */
        let lastFrameTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            // キューブの回転更新（ターゲット以外が回転）
            state.cubes.forEach(c => {
                if (!c.isTarget) {
                    c.mesh.rotation.x += c.rotSpeed.x;
                    c.mesh.rotation.y += c.rotSpeed.y;
                    c.mesh.rotation.z += c.rotSpeed.z;
                }
                if (c.flashTimer > 0) {
                    c.flashTimer -= delta;
                    if (c.flashTimer <= 0) {
                        c.mesh.material = c.originalMaterials;
                    }
                }
            });

            // 正解キューブのゴールドリングアニメーション
            if (goldRing) {
                goldRing.rotation.x += 0.02;
                goldRing.rotation.y += 0.03;
                const sc = 1 + Math.sin(now * 0.007) * 0.12;
                goldRing.scale.set(sc, sc, sc);
            }

            if (customControls) {
                customControls.update();
            }

            renderer.render(scene, camera);
            updateConfetti();
        }

        /* ==========================================================
           12. UI Event Bindings
           ========================================================== */
        // 自動回転切り替え
        let isAutoRotating = true;
        function setAutoRotate(enabled) {
            isAutoRotating = enabled;
            if (customControls) customControls.autoRotate = enabled;

            if (enabled) {
                btnAutoRotate.className = "glass-panel px-3.5 py-2 rounded-xl shadow-xl flex items-center gap-2 text-xs font-bold border border-cyan-400/60 bg-cyan-950/70 text-cyan-300 active:scale-95 transition-all";
                autoRotateIcon.className = "fa-solid fa-arrows-spin text-cyan-400 text-sm animate-spin";
                autoRotateText.textContent = "自動回転: ON";
                showToast('🔄 自動回転: ON (指を離すと回り続けます)');
            } else {
                btnAutoRotate.className = "glass-panel px-3.5 py-2 rounded-xl shadow-lg flex items-center gap-2 text-xs font-bold border border-white/20 bg-slate-900/60 text-gray-300 active:scale-95 transition-all";
                autoRotateIcon.className = "fa-solid fa-pause text-gray-400 text-sm";
                autoRotateText.textContent = "自動回転: OFF";
                showToast('⏸️ 自動回転: OFF');
            }
        }

        btnAutoRotate.addEventListener('click', () => setAutoRotate(!isAutoRotating));

        // 正面に戻す
        btnResetView.addEventListener('click', () => {
            if (customControls) customControls.resetFront();
        });

        // UI折りたたみトグル
        let isUICollapsed = false;
        btnToggleUI.addEventListener('click', () => {
            isUICollapsed = !isUICollapsed;
            if (isUICollapsed) {
                collapsibleToolbar.style.maxHeight = '0px';
                collapsibleToolbar.style.opacity = '0';
                collapsibleToolbar.style.pointerEvents = 'none';
                uiToggleIcon.classList.remove('fa-chevron-up');
                uiToggleIcon.classList.add('fa-chevron-down');
            } else {
                collapsibleToolbar.style.maxHeight = '120px';
                collapsibleToolbar.style.opacity = '1';
                collapsibleToolbar.style.pointerEvents = 'auto';
                uiToggleIcon.classList.remove('fa-chevron-down');
                uiToggleIcon.classList.add('fa-chevron-up');
            }
        });

        // やり直す
        btnRestart.addEventListener('click', () => {
            sfx.init();
            generateGame(false);
        });

        // 答えを見る
        btnGiveUp.addEventListener('click', giveUpAndShowTarget);

        // 難易度切り替え
        diffButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                diffButtons.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow');
                    b.classList.add('text-gray-300');
                });
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow');
                btn.classList.remove('text-gray-300');

                state.cubeCount = parseInt(btn.dataset.count);
                generateGame(false);
            });
        });

        /* ==========================================================
           13. 安全な初期化シーケンス (Error Fallback 付き)
           ========================================================== */
        window.addEventListener('load', () => {
            try {
                if (typeof THREE === 'undefined') {
                    throw new Error('Three.jsの読み込みに失敗しました。ネットワーク接続を確認してください。');
                }
                generateTextures();
                initScene();
                generateGame(false);
                animate();
            } catch (err) {
                console.error(err);
                const errScreen = document.getElementById('fatal-error-screen');
                const errMsg = document.getElementById('fatal-error-msg');
                if (errScreen && errMsg) {
                    errMsg.textContent = err.message || 'ゲームの初期化中にエラーが発生しました。';
                    errScreen.classList.remove('hidden');
                }
            }
        });
    </script>
</body>
</html>
