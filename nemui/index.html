<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>睡眠導入シミュレーター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070a12;
      color: #6a7a8c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    /* 操作バー：目立たないダークトーン */
    #nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 8px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(7,10,18,0.85), transparent);
      opacity: 0.35;
      transition: opacity 0.4s ease;
    }
    #nav:hover {
      opacity: 0.95;
    }
    button {
      background: #131b26;
      color: #8c9fb3;
      border: 1px solid #233142;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, color 0.2s;
    }
    button.active {
      background: #23354d;
      color: #cbd7e6;
      border-color: #3b5373;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #hint {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: #313f52;
      pointer-events: none;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="nav">
    <button id="btn-sheep" class="active" onclick="switchMode('sheep')">1. 羊追尾</button>
    <button id="btn-cradle" onclick="switchMode('cradle')">2. ニュートンのゆりかご</button>
    <button id="btn-rain" onclick="switchMode('rain')">3. 雨粒レース</button>
    <button id="btn-metronome" onclick="switchMode('metronome')">4. メトロノーム</button>
    <button id="btn-sand" onclick="switchMode('sand')">5. 砂落とし</button>
    <button id="btn-bubble" onclick="switchMode('bubble')">6. 気泡割り</button>
  </div>

  <canvas id="canvas"></canvas>
  <div id="hint">画面をタップすると微弱な音が有効になります</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let currentMode = 'sheep';

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (currentMode === 'sand') {
        initSandGrid();
      } else if (currentMode === 'rain') {
        initRain();
      }
    }
    window.addEventListener('resize', resize);

    // ==========================================
    // Web Audio API（低刺激な音の自動生成）
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('hint').style.display = 'none';
      }
    }
    window.addEventListener('pointerdown', initAudio, { once: true });

    // 羊の足音（低い「トフッ」というこもった音）
    function playStepSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(90, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // 球の衝突音（低めの「コツン」）
    function playClickSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);

      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // メトロノーム音（柔らかい「カチッ」）
    function playMetroSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);

      gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    // 気泡の破裂音（軽やかな「パチッ / プチッ」）
    function playPopSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const startFreq = 480 + Math.random() * 240;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 2.2, audioCtx.currentTime + 0.035);

      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.035);
    }

    // ==========================================
    // 1. エンドレス羊追尾シミュレーター
    // ==========================================
    const SHEEP_GAP = 280;
    let sheepOffset = 0;
    let lastStepIndex = -1;

    function drawFence(x, groundY) {
      ctx.strokeStyle = '#2d3b4e';
      ctx.fillStyle = '#2d3b4e';
      ctx.lineWidth = 3;
      ctx.fillRect(x - 20, groundY - 45, 6, 45);
      ctx.fillRect(x + 14, groundY - 45, 6, 45);
      ctx.beginPath();
      ctx.moveTo(x - 30, groundY - 35);
      ctx.lineTo(x + 30, groundY - 35);
      ctx.moveTo(x - 30, groundY - 15);
      ctx.lineTo(x + 30, groundY - 15);
      ctx.stroke();
    }

    function drawSheep(x, y, jumpY) {
      const sy = y - jumpY;
      ctx.save();
      ctx.translate(x, sy);

      ctx.strokeStyle = '#68778a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-16, 12); ctx.lineTo(-16, 26);
      ctx.moveTo(-6, 12);  ctx.lineTo(-6, 26);
      ctx.moveTo(8, 12);   ctx.lineTo(8, 26);
      ctx.moveTo(18, 12);  ctx.lineTo(18, 26);
      ctx.stroke();

      ctx.fillStyle = '#a6b8cc';
      ctx.beginPath();
      ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(-26, -4, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f1722';
      ctx.beginPath();
      ctx.arc(-30, -5, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function renderSheep() {
      ctx.fillStyle = '#0a0f18';
      ctx.fillRect(0, 0, width, height);

      const groundY = height * 0.65;
      const fenceX = width * 0.45;

      ctx.strokeStyle = '#1b2533';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY + 26);
      ctx.lineTo(width, groundY + 26);
      ctx.stroke();

      drawFence(fenceX, groundY + 26);

      sheepOffset += 1.1;

      const totalSheeps = Math.ceil(width / SHEEP_GAP) + 2;
      for (let i = -1; i < totalSheeps; i++) {
        let x = (width + 100) - ((sheepOffset + i * SHEEP_GAP) % (width + SHEEP_GAP * 2));
        let jumpY = 0;

        const distFromFence = x - fenceX;
        if (Math.abs(distFromFence) < 65) {
          const t = (distFromFence + 65) / 130;
          jumpY = Math.sin(t * Math.PI) * 45;
        }

        drawSheep(x, groundY, jumpY);
      }

      const stepInterval = 32;
      const currentIndex = Math.floor(sheepOffset / stepInterval);
      if (currentIndex !== lastStepIndex) {
        playStepSound();
        lastStepIndex = currentIndex;
      }
    }

    // ==========================================
    // 2. ニュートンのゆりかご
    // ==========================================
    const NUM_BALLS = 5;
    const BALL_RADIUS = 24;
    const ROPE_LEN = 260;
    let cradleTime = 0;
    let lastPhaseSide = 0;

    function renderCradle() {
      ctx.fillStyle = '#080c14';
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const originY = height * 0.22;
      const maxAngle = 0.55;
      const speed = 1.45;

      cradleTime += 0.016 * speed;
      const theta = Math.sin(cradleTime);

      let angles = [0, 0, 0, 0, 0];
      if (theta > 0) {
        angles[0] = -theta * maxAngle;
        if (lastPhaseSide !== 1 && theta > 0.05) {
          playClickSound();
          lastPhaseSide = 1;
        }
      } else {
        angles[4] = -theta * maxAngle;
        if (lastPhaseSide !== -1 && theta < -0.05) {
          playClickSound();
          lastPhaseSide = -1;
        }
      }

      ctx.strokeStyle = '#27364a';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(centerX - 120, originY);
      ctx.lineTo(centerX + 120, originY);
      ctx.stroke();

      for (let i = 0; i < NUM_BALLS; i++) {
        const attachX = centerX + (i - (NUM_BALLS - 1) / 2) * (BALL_RADIUS * 2);
        const ang = angles[i];
        const ballX = attachX + Math.sin(ang) * ROPE_LEN;
        const ballY = originY + Math.cos(ang) * ROPE_LEN;

        ctx.strokeStyle = 'rgba(100, 130, 160, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(attachX, originY);
        ctx.lineTo(ballX, ballY);
        ctx.stroke();

        const grad = ctx.createRadialGradient(
          ballX - BALL_RADIUS * 0.35,
          ballY - BALL_RADIUS * 0.35,
          BALL_RADIUS * 0.1,
          ballX,
          ballY,
          BALL_RADIUS
        );
        grad.addColorStop(0, '#8eaec9');
        grad.addColorStop(0.4, '#39516a');
        grad.addColorStop(1, '#0e1724');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ==========================================
    // 3. 雨粒の水滴レース（高密度・高質感）
    // ==========================================
    let drops = [];
    let staticDrops = [];

    function initRain() {
      drops = [];
      staticDrops = [];
      const count = Math.floor(width / 14); // 密度を約2.5倍に増加
      for (let i = 0; i < count; i++) {
        drops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 3.8 + 2.0,
          speed: Math.random() * 0.35 + 0.08,
          trail: []
        });
      }

      // 窓ガラスに張り付く微細な小粒の水滴（背景テクスチャ）
      const staticCount = Math.floor(width / 10);
      for (let i = 0; i < staticCount; i++) {
        staticDrops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.5 + 0.8,
          alpha: Math.random() * 0.35 + 0.15
        });
      }
    }

    function renderRain() {
      ctx.fillStyle = 'rgba(5, 8, 15, 0.3)';
      ctx.fillRect(0, 0, width, height);

      // 背景の遠景ボケ光（雨夜の街明かり）
      const blurLight = (lx, ly, lr, color) => {
        const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
        g.addColorStop(0, color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(lx, ly, lr, 0, Math.PI * 2);
        ctx.fill();
      };
      blurLight(width * 0.22, height * 0.65, 140, 'rgba(35, 65, 110, 0.05)');
      blurLight(width * 0.78, height * 0.35, 180, 'rgba(40, 55, 90, 0.04)');
      blurLight(width * 0.5, height * 0.85, 110, 'rgba(80, 70, 50, 0.03)');

      // 静止した微細水滴の描画
      for (const sd of staticDrops) {
        ctx.fillStyle = `rgba(180, 215, 255, ${sd.alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(sd.x, sd.y, sd.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // レースする動的雨粒の更新・描画
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];

        d.y += d.speed;
        if (Math.random() < 0.02) {
          d.speed += 0.35; // 突然滑り落ちる拍子
        } else {
          d.speed = Math.max(0.08, d.speed * 0.982);
        }

        // 軌跡
        if (Math.random() < 0.45) {
          d.trail.push({ x: d.x, y: d.y, r: d.r * 0.38, alpha: 0.38 });
          if (d.trail.length > 25) d.trail.shift();
        }

        // 軌跡の描画
        for (const tr of d.trail) {
          ctx.fillStyle = `rgba(175, 215, 255, ${tr.alpha})`;
          ctx.beginPath();
          ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI * 2);
          ctx.fill();
          tr.alpha *= 0.988;
        }

        // 立体的な水滴（ガラスの厚み・屈折を意識したハイライト）
        const grad = ctx.createRadialGradient(
          d.x - d.r * 0.35,
          d.y - d.r * 0.35,
          d.r * 0.08,
          d.x,
          d.y,
          d.r
        );
        grad.addColorStop(0, 'rgba(235, 248, 255, 0.9)');
        grad.addColorStop(0.3, 'rgba(170, 210, 250, 0.6)');
        grad.addColorStop(0.75, 'rgba(70, 110, 160, 0.25)');
        grad.addColorStop(1, 'rgba(10, 25, 45, 0.4)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();

        // 水滴の影（下部）
        ctx.fillStyle = 'rgba(0, 5, 15, 0.35)';
        ctx.beginPath();
        ctx.arc(d.x, d.y + d.r * 0.25, d.r * 0.7, 0, Math.PI);
        ctx.fill();

        // 接触・合体判定
        for (let j = i - 1; j >= 0; j--) {
          const d2 = drops[j];
          const dist = Math.hypot(d.x - d2.x, d.y - d2.y);
          if (dist < d.r + d2.r) {
            d.r = Math.min(13, Math.sqrt(d.r * d.r + d2.r * d2.r));
            d.speed += 1.0;
            drops.splice(j, 1);
            i--;
            break;
          }
        }

        // 画面下部に消えたら上部からリスポーン
        if (d.y > height + 20) {
          d.y = -10;
          d.x = Math.random() * width;
          d.r = Math.random() * 3.8 + 2.0;
          d.speed = Math.random() * 0.35 + 0.08;
          d.trail = [];
        }
      }

      if (drops.length < Math.floor(width / 16)) {
        drops.push({
          x: Math.random() * width,
          y: -10,
          r: Math.random() * 3.5 + 2,
          speed: 0.1,
          trail: []
        });
      }
    }

    // ==========================================
    // 4. メトロノームの針と点滅 (BPM 42)
    // ==========================================
    let metroTime = 0;
    const BPM = 42;
    const CYCLE_SEC = 60 / BPM;
    let prevTick = -1;

    function renderMetronome() {
      ctx.fillStyle = '#06090f';
      ctx.fillRect(0, 0, width, height);

      metroTime += 0.016;
      const phase = (metroTime / CYCLE_SEC) * Math.PI;
      const angle = Math.sin(phase) * 0.42;

      const currentTick = Math.floor(metroTime / CYCLE_SEC);
      if (currentTick !== prevTick) {
        playMetroSound();
        prevTick = currentTick;
      }

      const pulse = (Math.cos(phase) + 1) / 2;
      const lightRadius = 140 + pulse * 60;
      const lightGrad = ctx.createRadialGradient(
        width / 2,
        height * 0.52,
        0,
        width / 2,
        height * 0.52,
        lightRadius
      );
      lightGrad.addColorStop(0, `rgba(74, 110, 160, ${0.12 + pulse * 0.22})`);
      lightGrad.addColorStop(1, 'transparent');

      ctx.fillStyle = lightGrad;
      ctx.beginPath();
      ctx.arc(width / 2, height * 0.52, lightRadius, 0, Math.PI * 2);
      ctx.fill();

      const baseX = width / 2;
      const baseY = height * 0.72;
      const topY = height * 0.26;

      ctx.strokeStyle = '#182433';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(baseX - 80, baseY);
      ctx.lineTo(baseX + 80, baseY);
      ctx.lineTo(baseX + 30, topY);
      ctx.lineTo(baseX - 30, topY);
      ctx.closePath();
      ctx.stroke();

      const pivotY = baseY - 20;

      ctx.save();
      ctx.translate(baseX, pivotY);
      ctx.rotate(angle);

      const armLength = (baseY - topY) + 30;
      ctx.strokeStyle = '#5b7596';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 15);
      ctx.lineTo(0, -armLength);
      ctx.stroke();

      const weightY = -armLength * 0.72;
      ctx.fillStyle = '#8ea8c7';
      ctx.beginPath();
      ctx.rect(-10, weightY - 14, 20, 24);
      ctx.fill();

      ctx.restore();

      ctx.fillStyle = '#2f435c';
      ctx.beginPath();
      ctx.arc(baseX, pivotY, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    // ==========================================
    // 5. 砂落としシミュレーター（超微細・パウダー砂）
    // ==========================================
    const CELL_SIZE = 2; // より細かく美しい粒子に
    let sandCols = 0;
    let sandRows = 0;
    let sandGrid = null;
    let sandTilt = 0;

    // 洗練された砂のグラデーションパレット
    const sandColors = [
      '#7b6a4f',
      '#998463',
      '#b59f7c',
      '#cbb795',
      '#dfcca9',
      '#6b5b42'
    ];

    function initSandGrid() {
      sandCols = Math.floor(width / CELL_SIZE);
      sandRows = Math.floor(height / CELL_SIZE);
      sandGrid = new Uint8Array(sandCols * sandRows);
    }

    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma !== null) {
        sandTilt = Math.max(-1, Math.min(1, e.gamma / 30));
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (currentMode === 'sand') {
        if (window.DeviceOrientationEvent && ('ontouchstart' in window)) return;
        const norm = (e.clientX / width) * 2 - 1;
        sandTilt = Math.max(-1, Math.min(1, norm * 0.8));
      }
    });

    function renderSand() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, width, height);

      if (!sandGrid || sandCols === 0) return;

      // 上部中央ノズルからパウダー状の砂粒をさらさら落とす
      const centerCol = Math.floor(sandCols / 2);
      for (let k = 0; k < 4; k++) {
        const offset = Math.floor((Math.random() - 0.5) * 6);
        const spawnX = centerCol + offset;
        if (spawnX >= 0 && spawnX < sandCols) {
          if (sandGrid[spawnX] === 0) {
            sandGrid[spawnX] = Math.floor(Math.random() * 6) + 1;
          }
        }
      }

      // 静かな砂時計のガラスフレーム
      ctx.strokeStyle = '#1a2638';
      ctx.lineWidth = 2;
      const nozzleX = width / 2;
      ctx.beginPath();
      ctx.moveTo(nozzleX - 55, 0);
      ctx.lineTo(nozzleX - 12, 40);
      ctx.lineTo(nozzleX - 12, 55);
      ctx.moveTo(nozzleX + 55, 0);
      ctx.lineTo(nozzleX + 12, 40);
      ctx.lineTo(nozzleX + 12, 55);
      ctx.stroke();

      const prefDir = sandTilt > 0.15 ? 1 : (sandTilt < -0.15 ? -1 : 0);

      // 砂粒の物理挙動
      for (let y = sandRows - 2; y >= 0; y--) {
        const xIndices = [];
        for (let x = 0; x < sandCols; x++) xIndices.push(x);
        for (let i = xIndices.length - 1; i > 0; i--) {
          const r = Math.floor(Math.random() * (i + 1));
          const tmp = xIndices[i];
          xIndices[i] = xIndices[r];
          xIndices[r] = tmp;
        }

        for (let i = 0; i < sandCols; i++) {
          const x = xIndices[i];
          const idx = y * sandCols + x;
          const val = sandGrid[idx];

          if (val > 0) {
            const downIdx = (y + 1) * sandCols + x;

            if (sandGrid[downIdx] === 0) {
              sandGrid[downIdx] = val;
              sandGrid[idx] = 0;
            } else {
              let dir1, dir2;
              if (prefDir !== 0) {
                dir1 = prefDir;
                dir2 = -prefDir;
              } else {
                dir1 = Math.random() < 0.5 ? 1 : -1;
                dir2 = -dir1;
              }

              const nextX1 = x + dir1;
              const nextX2 = x + dir2;
              const downIdx1 = (y + 1) * sandCols + nextX1;
              const downIdx2 = (y + 1) * sandCols + nextX2;

              if (nextX1 >= 0 && nextX1 < sandCols && sandGrid[downIdx1] === 0) {
                sandGrid[downIdx1] = val;
                sandGrid[idx] = 0;
              } else if (nextX2 >= 0 && nextX2 < sandCols && sandGrid[downIdx2] === 0) {
                sandGrid[downIdx2] = val;
                sandGrid[idx] = 0;
              } else if (prefDir !== 0 && Math.abs(sandTilt) > 0.35) {
                const sideIdx = y * sandCols + (x + prefDir);
                if (x + prefDir >= 0 && x + prefDir < sandCols && sandGrid[sideIdx] === 0) {
                  if (Math.random() < 0.28) {
                    sandGrid[sideIdx] = val;
                    sandGrid[idx] = 0;
                  }
                }
              }
            }
          }
        }
      }

      // 砂粒の描画
      for (let y = 0; y < sandRows; y++) {
        for (let x = 0; x < sandCols; x++) {
          const val = sandGrid[y * sandCols + x];
          if (val > 0) {
            ctx.fillStyle = sandColors[val - 1];
            ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          }
        }
      }
    }

    // ==========================================
    // 6. 気泡割り（普通の速さ）
    // ==========================================
    let bubbles = [];
    let popParticles = [];

    function initBubbles() {
      bubbles = [];
      popParticles = [];
      const count = Math.floor(width / 70);
      for (let i = 0; i < count; i++) {
        spawnBubble(Math.random() * height);
      }
    }

    function spawnBubble(startY) {
      bubbles.push({
        x: Math.random() * (width - 60) + 30,
        y: startY !== undefined ? startY : height + Math.random() * 40 + 20,
        r: Math.random() * 18 + 14,
        baseSpeed: Math.random() * 1.2 + 1.2, // 普通のゆったりした上昇速さ
        wobbleSpeed: Math.random() * 0.03 + 0.02,
        wobbleAmp: Math.random() * 18 + 10,
        seed: Math.random() * 100,
        hue: Math.floor(Math.random() * 60) + 190 // 涼しげなシアン〜パープルの色相
      });
    }

    function triggerPop(x, y, r, hue) {
      playPopSound();
      // 破裂時の微小な水滴エフェクト
      for (let i = 0; i < 9; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1.5;
        popParticles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          alpha: 0.8,
          r: Math.random() * 2 + 1,
          hue: hue
        });
      }
    }

    // タップ / クリックで気泡を割る
    canvas.addEventListener('pointerdown', (e) => {
      if (currentMode !== 'bubble') return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(clickX - b.x, clickY - b.y);
        // タップ判定（少し甘めに）
        if (dist <= b.r + 14) {
          triggerPop(b.x, b.y, b.r, b.hue);
          bubbles.splice(i, 1);
          spawnBubble();
          break;
        }
      }
    });

    function renderBubbles() {
      ctx.fillStyle = '#060a14';
      ctx.fillRect(0, 0, width, height);

      // 上昇する気泡の更新・描画
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.baseSpeed;
        b.seed += b.wobbleSpeed;
        const currentX = b.x + Math.sin(b.seed) * (b.wobbleAmp * 0.4);

        // 石鹸膜の虹色・干渉光グラデーション
        const grad = ctx.createRadialGradient(
          currentX - b.r * 0.35,
          b.y - b.r * 0.35,
          b.r * 0.15,
          currentX,
          b.y,
          b.r
        );
        grad.addColorStop(0, `hsla(${b.hue}, 90%, 90%, 0.5)`);
        grad.addColorStop(0.5, `hsla(${b.hue + 40}, 80%, 75%, 0.25)`);
        grad.addColorStop(0.85, `hsla(${b.hue + 80}, 70%, 65%, 0.18)`);
        grad.addColorStop(1, `hsla(${b.hue}, 90%, 80%, 0.65)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(currentX, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        // 外周の薄い光彩
        ctx.strokeStyle = `hsla(${b.hue}, 85%, 85%, 0.55)`;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 表面の反射ハイライト
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.beginPath();
        ctx.ellipse(
          currentX - b.r * 0.42,
          b.y - b.r * 0.42,
          b.r * 0.28,
          b.r * 0.14,
          -Math.PI / 4,
          0,
          Math.PI * 2
        );
        ctx.fill();

        // 画面上部を越えたらリセット
        if (b.y < -b.r - 10) {
          bubbles.splice(i, 1);
          spawnBubble();
        }
      }

      // 破裂パーティクルの更新・描画
      for (let i = popParticles.length - 1; i >= 0; i--) {
        const p = popParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08; // わずかな重力
        p.alpha *= 0.92;

        ctx.fillStyle = `hsla(${p.hue}, 80%, 80%, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha < 0.05) {
          popParticles.splice(i, 1);
        }
      }
    }

    // ==========================================
    // メインループ & モード切替
    // ==========================================
    function loop() {
      switch (currentMode) {
        case 'sheep':
          renderSheep();
          break;
        case 'cradle':
          renderCradle();
          break;
        case 'rain':
          renderRain();
          break;
        case 'metronome':
          renderMetronome();
          break;
        case 'sand':
          renderSand();
          break;
        case 'bubble':
          renderBubbles();
          break;
      }
      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');

      if (mode === 'rain') {
        initRain();
      } else if (mode === 'sand') {
        initSandGrid();
      } else if (mode === 'bubble') {
        initBubbles();
      }
    }
  </script>
</body>
</html>
