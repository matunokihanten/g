<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動くステレオグラム - プロフェッショナル版</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: rgba(30, 30, 30, 0.7);
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --accent: #4dabf7;
      --accent-hover: #3bc9db;
      --border: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .app-container {
      display: grid;
      grid-template-columns: auto 320px;
      gap: 24px;
      max-width: 1000px;
      width: 100%;
      align-items: start;
    }

    @media (max-width: 800px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    .canvas-wrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
    }

    .controls-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
    }

    .value-display {
      color: var(--accent);
      font-family: monospace;
      font-size: 14px;
    }

    /* カスタムスライダー */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #444;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* カスタムセレクトボックス */
    select {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a2a;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: var(--accent);
    }

    /* カスタムチェックボックス */
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ボタン */
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      margin-top: 8px;
    }
    button:hover {
      background: var(--accent-hover);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>動くステレオグラム</h1>
    <p>焦点を奥に合わせて立体視してください。パネルから形状や動きをカスタマイズできます。</p>
  </header>

  <div class="app-container">
    <div class="canvas-wrapper">
      <canvas id="stereoCanvas" width="600" height="600"></canvas>
    </div>

    <aside class="controls-panel">
      
      <div class="control-group">
        <label class="control-header">
          背景パターン
        </label>
        <select id="patternSelect">
          <option value="tiled">立体視用タイル（推奨）</option>
          <option value="random">ランダムノイズ（元仕様）</option>
          <option value="color">カラーノイズ</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-header">
          隠し形状
        </label>
        <select id="shapeSelect">
          <option value="circle">円 (Circle)</option>
          <option value="square">四角 (Square)</option>
          <option value="triangle">三角 (Triangle)</option>
          <option value="star">星 (Star)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-header">
          動きの軌道
        </label>
        <select id="movementSelect">
          <option value="circle">円軌道</option>
          <option value="figure8">8の字</option>
          <option value="mouse">マウス追従</option>
          <option value="static">静止（中央）</option>
        </select>
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>深度（ズレ幅）</span>
          <span id="amplitudeValue" class="value-display">15 px</span>
        </div>
        <input type="range" id="amplitudeSlider" min="0" max="40" value="15">
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>形状の大きさ</span>
          <span id="shapeRadiusValue" class="value-display">100 px</span>
        </div>
        <input type="range" id="shapeRadiusSlider" min="30" max="250" value="100">
      </div>

      <div class="control-group" style="margin-top: 8px;">
        <label class="checkbox-label">
          <input type="checkbox" id="outlineCheckbox" checked>
          ガイド線（赤枠）を表示する
        </label>
      </div>

      <button id="regenerateButton">背景を再生成</button>

    </aside>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('stereoCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      // オフスクリーンキャンバス（背景画像用）
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');

      // アプリケーションの状態管理
      const config = {
        amplitude: 15,
        shapeRadius: 100,
        showOutline: true,
        patternType: 'tiled',
        shapeType: 'circle',
        movementType: 'circle'
      };

      // マウス位置の追従用
      const mouse = { x: width / 2, y: height / 2, active: false };
      let currentX = width / 2;
      let currentY = height / 2;

      // --- パターン生成ロジック ---
      function generatePattern() {
        const imageData = offCtx.createImageData(width, height);
        const data = imageData.data;
        
        if (config.patternType === 'random' || config.patternType === 'color') {
          // 単純な全面ノイズ
          const isColor = config.patternType === 'color';
          for (let i = 0; i < data.length; i += 4) {
            data[i]     = isColor ? Math.random() * 256 : Math.random() * 256;
            data[i + 1] = isColor ? Math.random() * 256 : data[i];
            data[i + 2] = isColor ? Math.random() * 256 : data[i];
            data[i + 3] = 255;
          }
        } else if (config.patternType === 'tiled') {
          // 立体視しやすいタイル状のノイズ（100px幅のパターンを繰り返す）
          const tileWidth = 100;
          const pattern = new Uint8Array(tileWidth * height * 4);
          
          // タイルの元データを作成
          for (let i = 0; i < pattern.length; i += 4) {
            const shade = Math.floor(Math.random() * 256);
            pattern[i] = shade;
            pattern[i+1] = shade;
            pattern[i+2] = shade;
            pattern[i+3] = 255;
          }
          
          // タイルを全体に敷き詰める
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const srcIdx = (y * tileWidth + (x % tileWidth)) * 4;
              const destIdx = (y * width + x) * 4;
              data[destIdx] = pattern[srcIdx];
              data[destIdx+1] = pattern[srcIdx+1];
              data[destIdx+2] = pattern[srcIdx+2];
              data[destIdx+3] = 255;
            }
          }
        }
        offCtx.putImageData(imageData, 0, 0);
      }

      // --- 形状描画ロジック ---
      function createShapePath(ctx, type, cx, cy, radius) {
        ctx.beginPath();
        switch (type) {
          case 'square':
            ctx.rect(cx - radius, cy - radius, radius * 2, radius * 2);
            break;
          case 'triangle':
            ctx.moveTo(cx, cy - radius);
            ctx.lineTo(cx + radius * 0.866, cy + radius * 0.5);
            ctx.lineTo(cx - radius * 0.866, cy + radius * 0.5);
            ctx.closePath();
            break;
          case 'star':
            const spikes = 5;
            const outerRadius = radius;
            const innerRadius = radius / 2;
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy;
            const step = Math.PI / spikes;
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
              x = cx + Math.cos(rot) * outerRadius;
              y = cy + Math.sin(rot) * outerRadius;
              ctx.lineTo(x, y);
              rot += step;
              x = cx + Math.cos(rot) * innerRadius;
              y = cy + Math.sin(rot) * innerRadius;
              ctx.lineTo(x, y);
              rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            break;
          case 'circle':
          default:
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            break;
        }
      }

      // --- イベントリスナー設定 ---
      const bindUI = (id, prop, isNumber = true) => {
        const el = document.getElementById(id);
        const valEl = document.getElementById(id + 'Value');
        el.addEventListener('input', (e) => {
          config[prop] = isNumber ? parseInt(e.target.value, 10) : e.target.value;
          if (valEl) valEl.textContent = config[prop] + (isNumber ? ' px' : '');
          if (id === 'patternSelect') generatePattern();
        });
      };

      bindUI('amplitudeSlider', 'amplitude');
      bindUI('shapeRadiusSlider', 'shapeRadius');
      bindUI('patternSelect', 'patternType', false);
      bindUI('shapeSelect', 'shapeType', false);
      bindUI('movementSelect', 'movementType', false);

      document.getElementById('outlineCheckbox').addEventListener('change', (e) => {
        config.showOutline = e.target.checked;
      });

      document.getElementById('regenerateButton').addEventListener('click', generatePattern);

      // マウスイベント
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        // 描画スケールに合わせて座標を補正
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouse.x = (e.clientX - rect.left) * scaleX;
        mouse.y = (e.clientY - rect.top) * scaleY;
        mouse.active = true;
      });
      canvas.addEventListener('mouseleave', () => mouse.active = false);

      // 初期パターン生成
      generatePattern();

      // --- アニメーションループ ---
      let startTime = null;

      function animate(time) {
        if (!startTime) startTime = time;
        const elapsed = time - startTime;

        // 深度（ディスプレイスメント）の計算：時間経過で滑らかに呼吸するように変化
        const displacement = config.amplitude * Math.sin(elapsed / 800);

        // 座標の計算
        let targetX = width / 2;
        let targetY = height / 2;

        switch (config.movementType) {
          case 'circle':
            targetX = width / 2 + 120 * Math.cos(elapsed / 1500);
            targetY = height / 2 + 120 * Math.sin(elapsed / 1500);
            break;
          case 'figure8':
            targetX = width / 2 + 150 * Math.sin(elapsed / 1000);
            targetY = height / 2 + 100 * Math.sin(elapsed / 500);
            break;
          case 'mouse':
            if (mouse.active) {
              targetX = mouse.x;
              targetY = mouse.y;
            }
            break;
          case 'static':
          default:
            break; // 中央のまま
        }

        // 線形補間(Lerp)による滑らかな座標移動
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;

        // 画面のクリアとベース背景の描画
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(offCanvas, 0, 0);

        // クリッピング領域（隠し形状）の作成
        ctx.save();
        createShapePath(ctx, config.shapeType, currentX, currentY, config.shapeRadius);
        ctx.clip();

        // 領域内だけ背景を少しズラして描画（これが立体視の要）
        ctx.drawImage(offCanvas, displacement, 0);
        ctx.restore();

        // ガイドライン（アウトライン）の描画
        if (config.showOutline) {
          createShapePath(ctx, config.shapeType, currentX, currentY, config.shapeRadius);
          ctx.strokeStyle = 'rgba(255, 60, 60, 0.8)';
          ctx.lineWidth = 3;
          // ダッシュ線にして少しスタイリッシュに
          ctx.setLineDash([8, 6]);
          ctx.stroke();
          ctx.setLineDash([]); // 元に戻す
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
